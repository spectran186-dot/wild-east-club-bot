name: Materialize uploaded home image
on:
  push:
    branches: [feature/mini-app-cloudflare-2026-09-18]
    paths:
      - ".image-ready"
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p miniapp/assets
          base64 -d .image-parts/home.b64 > miniapp/assets/home.jpg
          file miniapp/assets/home.jpg
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f miniapp/assets/home.jpg
          git rm .image-parts/home.b64 .image-ready .github/workflows/materialize-home-image.yml
          git commit -m "Update uploaded home image"
          git push