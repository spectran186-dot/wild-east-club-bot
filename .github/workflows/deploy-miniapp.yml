name: Deploy Wild East Club Mini App

on:
  workflow_run:
    workflows: ["Provision Wild East Club D1"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wild-east-club-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'feature/mini-app-cloudflare-2026-09-18') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout production Mini App branch
        uses: actions/checkout@v4
        with:
          ref: feature/mini-app-cloudflare-2026-09-18
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Validate Worker and Mini App
        run: |
          set -e
          node --check src/index.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for page in (Path("../miniapp/index.html"), Path("../miniapp/admin.html")):
              html = page.read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
              inline = [s for s in scripts if s.strip()]
              if not inline:
                  raise SystemExit(f"No inline JavaScript found in {page}")
              for i, script in enumerate(inline):
                  p = Path(tempfile.gettempdir()) / f"wild-east-{page.stem}-{i}.js"
                  p.write_text(script, encoding="utf-8")
                  subprocess.run(["node", "--check", str(p)], check=True)
              print(f"{page}: JavaScript syntax OK")
          PY

      - name: Verify D1 configuration
        run: |
          set -e
          test -f wrangler.toml
          grep -Eq '^database_id[[:space:]]*=[[:space:]]*"[^"]+"' wrangler.toml
          if grep -q 'REPLACE_WITH_D1_DATABASE_ID' wrangler.toml; then
            echo "D1 database_id is still a placeholder."
            exit 1
          fi
          echo "Wrangler configuration OK"

      - name: Configure Telegram bot secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -e
          test -n "$BOT_TOKEN"
          printf '%s' "$BOT_TOKEN" | wrangler secret put BOT_TOKEN

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[A-Za-z0-9._-]+\\.workers\\.dev' deploy.log | head -n 1 || true)
          test -n "$URL"
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"
          {
            echo "### 🚀 Worker deployed"
            echo ""
            echo "**Worker:** $URL"
            echo "**API:** $URL/api/events"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Telegram webhook
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WORKER_URL: ${{ env.WORKER_URL }}
        run: |
          set -e
          SECRET=$(printf '%s' "$BOT_TOKEN" | openssl dgst -sha256 -hmac "webhook-secret" -binary | xxd -p -c 256)
          RESPONSE=$(curl -fsS -X POST "https://api.telegram.org/bot$BOT_TOKEN/setWebhook"             -H "Content-Type: application/json"             --data-raw "{\"url\":\"$WORKER_URL/telegram/webhook\",\"secret_token\":\"$SECRET\",\"drop_pending_updates\":true}")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true'

      - name: Verify Telegram webhook
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WORKER_URL: ${{ env.WORKER_URL }}
        run: |
          set -e
          INFO=$(curl -fsS "https://api.telegram.org/bot$BOT_TOKEN/getWebhookInfo")
          echo "$INFO"
          echo "$INFO" | grep -q '"ok":true'
          EXPECTED="$WORKER_URL/telegram/webhook"
          ACTUAL=$(printf '%s' "$INFO" | sed -n 's/.*"url":"\\([^"]*\\)".*/\\1/p')
          test "$ACTUAL" = "$EXPECTED"

      - name: Verify live API
        env:
          WORKER_URL: ${{ env.WORKER_URL }}
        run: |
          set -e
          HTTP_CODE=$(curl -sS -o api-response.json -w "%{http_code}" "$WORKER_URL/api/events")
          cat api-response.json
          test "$HTTP_CODE" = "200"
          {
            echo "### ✅ Live API check passed"
            echo ""
            echo "**GET /api/events:** HTTP $HTTP_CODE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live Mini App pages
        env:
          WORKER_URL: ${{ env.WORKER_URL }}
        run: |
          set -e
          curl -fsSL -H "Cache-Control: no-cache" "$WORKER_URL/?v=$GITHUB_SHA" -o tourist.html
          curl -fsSL -H "Cache-Control: no-cache" "$WORKER_URL/admin.html?v=$GITHUB_SHA" -o admin.html
          grep -q '<title>Wild East Club</title>' tourist.html
          grep -q 'Административная панель' admin.html
          if grep -q 'adminTab' tourist.html || grep -q 'Административная панель' tourist.html; then
            echo "Tourist page contains admin UI."
            exit 1
          fi
          echo "Live Mini App pages: OK"
