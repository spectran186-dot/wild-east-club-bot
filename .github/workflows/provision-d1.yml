name: Provision Wild East Club D1

on:
  push:
    branches:
      - feature/mini-app-cloudflare-2026-09-18
  workflow_dispatch:

permissions:
  contents: write

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/mini-app-cloudflare-2026-09-18
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Check or create D1
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          wrangler d1 list --json > /tmp/d1.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/d1.json'))
          items = data if isinstance(data, list) else data.get("result", [])
          found=next((x for x in items if x.get("name")=="wild-east-club"), None)
          if found:
              dbid=found.get("uuid") or found.get("database_id") or found.get("id")
              if not dbid:
                  raise SystemExit("Existing D1 found but no database ID was returned")
              print(f"Using existing D1: {dbid}")
              open("/tmp/dbid","w").write(dbid)
          else:
              print("D1 wild-east-club not found; creating it")
              open("/tmp/dbid","w").write("")
          PY

          if [ ! -s /tmp/dbid ]; then
            wrangler d1 create wild-east-club --location=weur > /tmp/create.txt
            cat /tmp/create.txt
            python - <<'PY'
            import re
            from pathlib import Path
            s=Path("/tmp/create.txt").read_text()
            m=re.search(r"[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}", s)
            if not m:
                raise SystemExit("Could not determine newly created D1 database ID from Wrangler output")
            Path("/tmp/dbid").write_text(m.group(0))
            PY
            exit 0
            #
            python - <<'PY'
          import json
          data=json.load(open("/tmp/create.json"))
          result=data.get("result", data) if isinstance(data, dict) else data
          dbid=result.get("uuid") or result.get("database_id") or result.get("id")
          if not dbid:
              raise SystemExit("Could not determine newly created D1 database ID")
          print(f"Created D1: {dbid}")
          open("/tmp/dbid","w").write(dbid)
          PY
          fi

          echo "DB_ID=$(cat /tmp/dbid)" >> "$GITHUB_ENV"

      - name: Update Wrangler config
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          p=Path("worker/wrangler.toml")
          s=p.read_text()
          dbid=os.environ["DB_ID"]
          s=re.sub(r'database_id\s*=\s*"[^"]+"', f'database_id = "{dbid}"', s)
          p.write_text(s)
          PY

      - name: Commit D1 binding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/wrangler.toml
          if git diff --cached --quiet; then
            echo "No config changes to commit"
          else
            git commit -m "Configure Cloudflare D1 database"
            git push origin HEAD:feature/mini-app-cloudflare-2026-09-18
          fi

      - name: Apply D1 schema
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler d1 execute wild-east-club --remote --file=schema.sql

      - name: Summary
        run: |
          echo "D1 database configured successfully."
          echo "Database ID: $DB_ID"
