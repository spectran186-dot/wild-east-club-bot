name: Provision Wild East Club D1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wild-east-club-d1
  cancel-in-progress: true

jobs:
  provision:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/mini-app-cloudflare-2026-09-18
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Check or create D1
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          wrangler d1 list --json > /tmp/d1.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/d1.json'))
          items=data if isinstance(data,list) else data.get("result",[])
          found=next((x for x in items if x.get("name")=="wild-east-club"),None)
          if found:
              dbid=found.get("uuid") or found.get("database_id") or found.get("id")
          else:
              dbid=""
          if not dbid:
              print("D1 wild-east-club not found; creating it")
              import subprocess,re
              out=subprocess.check_output(["wrangler","d1","create","wild-east-club","--location=weur"],text=True)
              print(out)
              m=re.search(r'database_id\s*=\s*"([^"]+)"']+)"',out)
              if not m: raise SystemExit("Could not determine D1 database ID")
              dbid=m.group(1)
          print("Using D1:",dbid)
          open("/tmp/dbid","w").write(dbid)
          PY
          echo "DB_ID=$(cat /tmp/dbid)" >> "$GITHUB_ENV"

      - name: Update Wrangler D1 binding
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path("worker/wrangler.toml")
          s=p.read_text()
          dbid=os.environ["DB_ID"]
          s=re.sub(r'database_id\s*=\s*"([^"]+)"']+"', f'database_id = "{dbid}"', s)
          p.write_text(s)
          PY

      - name: Commit D1 binding when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/wrangler.toml
          if git diff --cached --quiet; then
            echo "D1 binding already current"
          else
            git commit -m "Configure Cloudflare D1 database"
            git push origin HEAD:feature/mini-app-cloudflare-2026-09-18
          fi

      - name: Apply D1 schema
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          wrangler d1 execute wild-east-club --remote --file=schema.sql

      - name: Summary
        run: |
          echo "D1 database configured successfully."
          echo "Database ID: $DB_ID"
