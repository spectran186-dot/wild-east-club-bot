<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wild East Club</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--green:#063f36;--green2:#0a5b4d;--yellow:#ffe600;--cream:#f5f4ee;--white:#fff;--text:#102c27;--muted:#6b7975;--line:#d7dfdc}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream);color:var(--text);font:15px/1.42 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}body{padding-bottom:78px}
.wrap{max-width:760px;margin:auto}.page{padding:0 14px 24px}.home{min-height:100vh;position:relative;overflow:hidden;background:linear-gradient(180deg,#062f29aa 0%,#062f2940 42%,#031e19e8 100%),url("/assets/home.jpg") center/cover no-repeat;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:22px 18px 110px}
.home:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0003 0%,transparent 45%,#0009 100%);pointer-events:none}.home>*{position:relative;z-index:1}
.home-logo{display:block;width:112px;height:112px;object-fit:cover;border-radius:50%;margin:0 auto;filter:drop-shadow(0 6px 18px #0007)}.home-top{text-align:center}.brand-name{font-size:20px;font-weight:900;letter-spacing:.8px;margin-top:8px}.brand-sub{font-size:10px;letter-spacing:1.8px;margin-top:3px;opacity:.9}.home-copy{margin-top:auto;padding:0 0 12px}.home-copy h1{font-size:36px;line-height:.98;margin:0 0 9px;font-weight:950;text-shadow:0 3px 15px #0008}.home-copy p{font-size:17px;margin:0;font-weight:650;text-shadow:0 2px 8px #0008}.home-cta{width:100%;border:0;border-radius:18px;background:var(--yellow);color:#10251f;padding:17px 18px;font-size:20px;font-weight:950;box-shadow:0 8px 26px #0005;animation:pulse 2.4s ease-in-out infinite}.home-cta:active{transform:scale(.98)}
@keyframes pulse{0%,100%{box-shadow:0 8px 26px #0005}50%{box-shadow:0 8px 34px #ffe60066}}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;padding:18px 0 12px}.section-head h1{font-size:28px;margin:0;font-weight:950}.back-link{border:0;background:none;color:var(--green2);font-weight:800}
.filters{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.filter{border:1px solid #b9c7c2;background:#fff;border-radius:999px;padding:8px 16px;font-weight:800;white-space:nowrap}.filter.active{background:var(--yellow);border-color:var(--yellow)}
.carousel::-webkit-scrollbar{display:none}.event-card{flex:0 0 86%;scroll-snap-align:center;border-radius:22px;overflow:hidden;background:#fff;border:1px solid #cdd8d4;box-shadow:0 10px 25px #063f3620;transform:translateY(12px);opacity:0;animation:cardIn .65s cubic-bezier(.2,.8,.2,1) forwards}.event-card:nth-child(2){animation-delay:.1s}.event-card:nth-child(3){animation-delay:.2s}.event-card:nth-child(4){animation-delay:.3s}@keyframes cardIn{to{transform:translateY(0);opacity:1}}.event-visual{height:210px;background:linear-gradient(160deg,#063f3680,#0008),var(--preview) center/cover;position:relative}.event-visual:after{content:"SUP";position:absolute;right:15px;bottom:10px;font-size:48px;font-weight:950;color:#fff5;letter-spacing:2px}.route-tag{position:absolute;left:14px;top:14px;background:var(--yellow);padding:7px 12px;border-radius:999px;font-weight:950}.event-body{padding:15px}.event-body h2{font-size:22px;line-height:1.05;margin:0 0 8px}.meta{color:#50635e;font-size:13px;margin:4px 0}.event-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px}.price{font-size:20px;font-weight:950}.card-btn{border:0;background:var(--green2);color:#fff;border-radius:12px;padding:11px 14px;font-weight:850}.dots b{color:var(--yellow)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 4px 16px #063f3610}.title{font-size:20px;font-weight:900}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;margin:7px 0}input,textarea{width:100%;padding:12px;border:1.5px solid #aab8b3;border-radius:11px;background:#fff;color:var(--text);margin:5px 0 12px}.participant{border:1px solid #c8d2ce;border-radius:14px;padding:12px;margin:9px 0}.phone-action{width:100%;padding:9px;border:1px dashed #9eb0aa;border-radius:10px;background:#f2f7f4;color:var(--green2);text-align:left}.btn{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff;color:var(--text);font-weight:800;margin-top:9px}.primary{background:var(--green2);border-color:var(--green2);color:#fff}.yellow{background:var(--yellow);border-color:var(--yellow)}.error{color:#c33}.center{text-align:center}
.contact-row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid #e2e7e4}.contact-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e9f2ee;font-size:20px}.contact-row a{color:var(--green2);font-weight:800;text-decoration:none}
.bottom-nav{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#063f36ee;border-top:1px solid #d7dfdc;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 -6px 20px #063f3615}.nav-btn{border:0;background:transparent;color:#dce8e4;font-weight:800;padding:4px}.nav-btn.active{color:var(--yellow)}.nav-icon{display:block;font-size:21px;line-height:22px;margin-bottom:2px}.hidden{display:none}
@media(min-width:600px){.home{min-height:calc(100vh - 78px);border-radius:0 0 24px 24px}}
.route-list{display:flex;flex-direction:column;gap:10px}.event-card{position:relative;width:100%;height:3cm;min-height:113px;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(6,63,54,.08);animation:cardIn .3s ease both;cursor:pointer}.event-visual{height:46px;min-height:46px;width:100%;background-image:var(--preview),linear-gradient(135deg,#0a5b4d,#063f36);background-size:cover;background-position:center}.event-visual:after{content:"";position:absolute;inset:0 0 auto 0;height:46px;background:linear-gradient(180deg,#0003,#0000);pointer-events:none}.event-body{position:relative;flex:1;padding:7px 38px 7px 12px;display:flex;flex-direction:column;justify-content:center}.event-body h2{margin:0 0 3px;font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;line-height:1.25;margin:2px 0}.event-bottom{display:flex;align-items:center;justify-content:flex-start;gap:8px;margin-top:2px}.price{font-size:15px;font-weight:950}.event-arrow{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:28px;line-height:1;color:var(--text);font-weight:300}.route-tag{display:none}</style></head><body><div class="wrap"><main id="app">Загрузка…</main></div><nav class="bottom-nav"><button class="nav-btn active" data-page="home"><span class="nav-icon">⌂</span>Главная</button><button class="nav-btn" data-page="events"><span class="nav-icon">▣</span>Мероприятия</button><button class="nav-btn" data-page="contacts"><span class="nav-icon">⌕</span>Контакты</button></nav><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||"",app=document.getElementById("app");const S={events:[],page:"home",event:null,people:[]};window.addEventListener("error",e=>{if(app)app.innerHTML='<div class="page"><div class="card error">Ошибка JavaScript: '+esc(e.message||"Неизвестная ошибка")+'</div></div>'});window.addEventListener("unhandledrejection",e=>{if(app)app.innerHTML='<div class="page"><div class="card error">Ошибка: '+esc(String(e.reason?.message||e.reason||"Неизвестная ошибка"))+'</div></div>'});
const api=async(path,opt={})=>{const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),10000);try{const r=await fetch("/api"+path,{...opt,signal:ctrl.signal,cache:"no-store",headers:{"Content-Type":"application/json","X-Telegram-Init-Data":initData,...(opt.headers||{})}});const d=await r.json().catch(()=>({error:"Ошибка ответа"}));if(!r.ok)throw Error(d.error||("HTTP "+r.status));return d}catch(e){if(e.name==="AbortError")throw Error("Сервер не отвечает более 10 секунд");throw e}finally{clearTimeout(timer)}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));const money=v=>Number(v||0).toLocaleString("ru-RU")+" ₽";const dt=v=>{if(!v)return"—";const p=String(v).split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:v};const go=p=>{S.page=p;render();window.scrollTo({top:0,behavior:"smooth"})};
function render(){document.querySelectorAll(".nav-btn").forEach(x=>x.classList.toggle("active",x.dataset.page===S.page));if(S.page==="home")home();else if(S.page==="events")events();else if(S.page==="contacts")contacts();else if(S.page==="booking")bookForm()}
function home(){app.innerHTML='<section class="home"><div class="home-top"><img class="home-logo" src="/assets/wild-east-club-logo.jpg" alt="wild east club"></div><div class="home-copy"><button class="home-cta" onclick="go(\'events\')">Выбрать мероприятие →</button></div></section>'}
async function events(){app.innerHTML='<div class="page"><div class="section-head"><h1>Мероприятия</h1></div><div class="route-tabs"><button class="route-tab active" onclick="filterEvents(\'sup\',this)">🛶 САП-СПЛАВЫ</button><button class="route-tab" onclick="filterEvents(\'hiking\',this)">🥾 ПЕШИЕ МАРШРУТЫ</button></div><div id="event-area" class="card muted">Загрузка…</div></div>';try{const d=await api("/events");S.events=d.events||[];drawEvents("sup")}catch(e){document.getElementById("event-area").innerHTML='<div class="error">⚠️ '+esc(e.message)+'</div>'}}
function filterEvents(type,btn){document.querySelectorAll(".route-tab").forEach(x=>x.classList.remove("active"));btn.classList.add("active");drawEvents(type)}
function drawEvents(type){const list=S.events.filter(e=>{const rt=String(e.route_type||"sup").toLowerCase();const title=String(e.route_title||"");const hiking=rt==="hiking"||rt==="пеший"||/пеш|поход|трек|трекинг|лес|гора|сопка/i.test(title);return type==="hiking"?hiking:!hiking});const area=document.getElementById("event-area");if(!area)return;if(!list.length){area.innerHTML='<div class="muted">Пока нет мероприятий этого типа.</div>';return}area.className="";area.innerHTML='<div class="route-list">'+list.map((e,i)=>'<article class="event-card" style="--preview:url(\\'/assets/event-'+((i%4)+1)+'.jpg\\')" onclick="bookStart('+e.id+')"><div class="event-visual"></div><div class="event-body"><h2>'+esc(e.route_title||"Маршрут")+'</h2><div class="meta">📅 '+dt(e.event_date)+' · ⏰ '+esc(e.event_time)+'</div><div class="event-bottom"><div class="price">'+money(e.price)+' / чел.</div><div class="meta">Свободно: '+e.free_places+'</div></div><span class="event-arrow">›</span></div></article>').join("")+'</div>'}
async function bookStart(id){S.event=S.events.find(x=>x.id===id);S.people=[{full_name:"",phone:"",children:false,comment:""}];try{const d=await api("/profile");if(d.phone)S.people[0].phone=d.phone}catch(e){}S.page="booking";render()}
function bookForm(){const e=S.event;if(!e){go("events");return}app.innerHTML='<div class="page"><div class="section-head"><h1>Запись</h1><button class="back-link" onclick="go(\'events\')">Назад</button></div><div class="card"><div class="title">'+esc(e.route_title)+'</div><p>📅 '+dt(e.event_date)+' · '+esc(e.event_time)+'<br>📍 '+esc(e.meeting_point||e.start_point||"—")+'<br>💰 '+money(e.price)+' за участника</p><div id="people"></div><button class="btn" onclick="addPerson()">➕ Добавить участника</button><button class="btn primary" onclick="sendBooking()">✅ Подтвердить заявку</button></div></div>';drawPeople()}
function drawPeople(){document.getElementById("people").innerHTML=S.people.map((p,i)=>'<div class="participant"><b>Участник '+(i+1)+'</b><label>Имя и фамилия<input value="'+esc(p.full_name)+'" oninput="S.people['+i+'].full_name=this.value"></label><label>Телефон<input inputmode="tel" value="'+esc(p.phone)+'" oninput="S.people['+i+'].phone=this.value"><button type="button" class="phone-action" onclick="requestPhone('+i+')">📱 Подставить мой номер из Telegram</button></label><label><input type="checkbox" '+(p.children?"checked":"")+' onchange="S.people['+i+'].children=this.checked"> Ребёнок на SUP (+500 ₽)</label><label>Комментарий<textarea oninput="S.people['+i+'].comment=this.value">'+esc(p.comment)+'</textarea></label></div>').join("")}
function addPerson(){S.people.push({full_name:"",phone:"",children:false,comment:""});bookForm()}
async function requestPhone(i){try{if(!tg||!tg.requestContact)throw Error("Автоматическая передача номера недоступна");const ok=await new Promise(resolve=>tg.requestContact(resolve));if(!ok)return;let d=null;for(let n=0;n<5;n++){try{d=await api("/profile");if(d.phone)break}catch(e){}await new Promise(resolve=>setTimeout(resolve,700))}if(d?.phone){S.people[i].phone=d.phone;drawPeople()}else alert("Не удалось получить номер. Попробуйте ещё раз.")}catch(e){alert(e.message||"Не удалось получить номер телефона")}}
async function sendBooking(){try{const d=await api("/bookings",{method:"POST",body:JSON.stringify({event_id:S.event.id,participants:S.people})});app.innerHTML='<div class="page"><div class="card center"><div class="title">🎉 Заявка принята!</div><p>Участников: '+d.count+'<br>💰 Итого: '+money(d.total)+'</p><p>Организатор свяжется с вами для подтверждения участия.</p><button class="btn primary" onclick="go(\'events\')">📅 К мероприятиям</button></div></div>'}catch(e){app.innerHTML='<div class="page"><div class="card error">⚠️ '+esc(e.message)+'</div><button class="btn" onclick="bookForm()">⬅️ Вернуться</button></div>'}}
function contacts(){app.innerHTML='<div class="page"><div class="section-head"><h1>Контакты</h1></div><div class="card"><div class="contact-row"><span class="contact-icon">☎</span><div><a href="tel:+79244160083">+7 924 416-00-83</a><div class="muted">Позвонить</div></div></div><div class="contact-row"><span class="contact-icon">➤</span><div><a href="https://t.me/wild_east_club" target="_blank" rel="noopener">@wild_east_club</a><div class="muted">Telegram</div></div></div><div class="contact-row"><span class="contact-icon">◎</span><div><a href="https://instagram.com/wild_east_club" target="_blank" rel="noopener">@wild_east_club</a><div class="muted">Instagram</div></div></div></div><div class="card"><div class="title">Присоединяйся к приключениям!</div><p class="muted">SUP-прогулки, сплавы и пешие маршруты.</p></div><div class="card"><div class="muted">Разработка: <a href="https://t.me/spectran186" target="_blank" rel="noopener">@spectran186</a></div></div></div>'}
document.querySelectorAll(".nav-btn").forEach(b=>b.onclick=()=>go(b.dataset.page));render();
</script></body></html>
