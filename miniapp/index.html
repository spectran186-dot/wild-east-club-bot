<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wild East Club</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--green:#063f36;--green2:#0a5b4d;--yellow:#ffe000;--cream:#f5f4ee;--white:#fff;--text:#102c27;--muted:#6b7975;--line:#d7dfdc}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream);color:var(--text);font:15px/1.42 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}.wrap{max-width:760px;margin:auto}body{padding-bottom:78px}.page{padding:0 14px 24px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 2px 12px}.section-head h1{font-size:28px;margin:0;font-weight:950;letter-spacing:-.5px}.back-link{border:0;background:none;color:var(--green2);font-weight:800}
.home{min-height:calc(100vh - 78px);position:relative;overflow:hidden;background:linear-gradient(180deg,#063f3640 0%,#063f3640 38%,#031e19ee 100%),url("/assets/home.svg") center/cover no-repeat;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:26px 18px 112px}.home:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0001 0%,transparent 42%,#000b 100%);pointer-events:none}.home>*{position:relative;z-index:1}.home-logo{display:block;width:104px;height:104px;object-fit:cover;border-radius:50%;margin:0 auto;filter:drop-shadow(0 5px 14px #0007)}.home-top{text-align:center}.brand-name{font-size:21px;font-weight:950;letter-spacing:1px;margin-top:7px}.brand-sub{font-size:10px;letter-spacing:1.7px;margin-top:4px;opacity:.95}.home-copy{margin-top:auto;padding-bottom:10px}.home-copy h1{font-size:34px;line-height:.98;margin:0 0 10px;font-weight:950;text-shadow:0 3px 15px #0009;max-width:340px}.home-copy p{font-size:13px;letter-spacing:2px;text-transform:uppercase;margin:0 0 18px;font-weight:750}.home-cta{width:100%;border:0;border-radius:18px;background:var(--yellow);color:#10251f;padding:16px 18px;font-size:17px;font-weight:950;box-shadow:0 8px 26px #0005}.home-cta:active{transform:scale(.98)}
.events-page{padding:0 0 24px}.events-head{background:var(--green);color:#fff;padding:10px 12px 11px;border-radius:0 0 16px 16px;box-shadow:0 4px 14px #063f3620}.events-head h1{font-size:23px;line-height:1.05;margin:0 0 9px;font-weight:950}.route-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px}.route-tab{min-height:40px;border:1px solid #ffffff22;border-radius:13px;background:#164f47;color:#e7f0ed;padding:7px 6px;font-size:11px;font-weight:950;box-shadow:inset 0 1px #ffffff16;transition:.18s}.participant-title{display:block;margin-bottom:9px}.participant input[type="checkbox"]{width:auto;height:auto;margin:0 7px 0 0;vertical-align:middle}.child-option{display:block;margin-top:12px;margin-bottom:12px;white-space:nowrap}.route-tab.active{background:var(--yellow);border-color:var(--yellow);color:#102c27;box-shadow:0 5px 13px #0003}.route-tab:active{transform:scale(.98)}
.event-area{padding:14px}.route-list{display:flex;flex-direction:column;gap:12px}.event-card{position:relative;width:100%;aspect-ratio:2/1;display:flex;flex-direction:column;border-radius:19px;overflow:hidden;background:#fff;border:1px solid #d9e3df;box-shadow:0 8px 24px #063f3620;cursor:pointer;transition:transform .18s,box-shadow .18s}.event-card:active{transform:scale(.985);box-shadow:0 4px 14px #063f3618}.event-visual{height:48%;min-height:48%;width:100%;position:relative;background-image:var(--preview),linear-gradient(135deg,#0a5b4d,#063f36);background-size:cover;background-position:center}.event-visual:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 45%,#0007 100%);pointer-events:none}.event-body{position:relative;flex:1;padding:9px 48px 9px 14px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(180deg,#fff 0%,#f8fbfa 100%)}.event-body h2{margin:0 0 5px;font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:950}.meta{color:#5a6d68;font-size:11px;line-height:1.25;margin:2px 0}.event-bottom .meta{background:#eef4f1;border-radius:999px;padding:4px 8px;font-weight:800;margin-left:auto}.event-bottom{display:flex;align-items:center;gap:9px;margin-top:4px}.price{background:var(--yellow);border-radius:999px;padding:5px 9px;font-size:13px;font-weight:950;color:var(--text)}.event-arrow{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--green2);color:#fff;font-size:25px;line-height:1;font-weight:300;box-shadow:0 5px 12px #063f3630}
.empty-state{padding:20px 4px;text-align:center;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 4px 16px #063f3610}.title{font-size:20px;font-weight:900}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;margin:7px 0}input,textarea{width:100%;padding:12px;border:1.5px solid #aab8b3;border-radius:11px;background:#fff;color:var(--text);margin:5px 0 12px}.invalid{border-color:#d33!important;box-shadow:0 0 0 2px #d333}.participant{border:1px solid #c8d2ce;border-radius:14px;padding:12px;margin:9px 0}.phone-action{width:100%;padding:9px;border:1px dashed #9eb0aa;border-radius:10px;background:#f2f7f4;color:var(--green2);text-align:left}.btn{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff;color:var(--text);font-weight:800;margin-top:9px}.primary{background:var(--green2);border-color:var(--green2);color:#fff}.yellow{background:var(--yellow);border-color:var(--yellow)}.error{color:#c33}.center{text-align:center}
.contact-row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid #e2e7e4}.contact-social-icon{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;background:var(--green);color:#fff;font-size:20px}.contact-social-icon svg{width:22px;height:22px;fill:currentColor}.contact-row a{color:var(--green2);font-weight:800;text-decoration:none}.contacts-hero{background:linear-gradient(180deg,#063f36e8,#063f36f5),url("/assets/home.svg") center/cover;border-radius:0 0 24px 24px;color:#fff;padding:20px 14px 22px;margin-bottom:14px}.contacts-hero h1{margin:0;font-size:28px}
.bottom-nav{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#063f36f5;border-top:1px solid #ffffff18;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 -6px 20px #063f3620}.nav-btn{border:0;background:transparent;color:#dce8e4;font-weight:800;padding:4px}.nav-btn.active{color:var(--yellow)}.nav-icon{display:block;font-size:21px;line-height:22px;margin-bottom:2px}.hidden{display:none}@media(min-width:600px){.home{border-radius:0 0 24px 24px}.events-page{max-width:760px;margin:auto}}
</style></head><body><div class="wrap"><main id="app">Загрузка…</main></div><nav class="bottom-nav"><button class="nav-btn active" data-page="home"><span class="nav-icon">⌂</span>Главная</button><button class="nav-btn" data-page="events"><span class="nav-icon">▣</span>Мероприятия</button><button class="nav-btn" data-page="contacts"><span class="nav-icon">☎</span>Контакты</button></nav><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||"",app=document.getElementById("app");const S={events:[],page:"home",event:null,people:[],homeImage:"",showValidation:false};window.addEventListener("error",e=>{if(app)app.innerHTML='<div class="page"><div class="card error">Ошибка JavaScript: '+esc(e.message||"Неизвестная ошибка")+'</div></div>'});window.addEventListener("unhandledrejection",e=>{if(app)app.innerHTML='<div class="page"><div class="card error">Ошибка: '+esc(String(e.reason?.message||e.reason||"Неизвестная ошибка"))+'</div></div>'});
const api=async(path,opt={})=>{const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),10000);try{const r=await fetch("/api"+path,{...opt,signal:ctrl.signal,cache:"no-store",headers:{"Content-Type":"application/json","X-Telegram-Init-Data":initData,...(opt.headers||{})}});const d=await r.json().catch(()=>({error:"Ошибка ответа"}));if(!r.ok)throw Error(d.error||("HTTP "+r.status));return d}catch(e){if(e.name==="AbortError")throw Error("Сервер не отвечает более 10 секунд");throw e}finally{clearTimeout(timer)}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));const money=v=>Number(v||0).toLocaleString("ru-RU")+" ₽";const dt=v=>{if(!v)return"—";const p=String(v).split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:v};const go=p=>{S.page=p;render();window.scrollTo({top:0,behavior:"smooth"})};
function render(){document.querySelectorAll(".nav-btn").forEach(x=>x.classList.toggle("active",x.dataset.page===S.page));if(S.page==="home")home();else if(S.page==="events")events();else if(S.page==="contacts")contacts();else if(S.page==="booking")bookForm()}
function home(){app.innerHTML='<section class="home" id="home-screen"><div class="home-top"><img class="home-logo" src="/assets/wild-east-club-logo.jpg" alt="wild east club"><div class="brand-name">WILD EAST CLUB</div><div class="brand-sub">СТИРАЯ ГРАНИЦЫ, СОЗДАВАЯ МОМЕНТЫ</div></div><div class="home-copy"><h1>Приключения<br>на Дальнем Востоке</h1><p>SUP-сплавы · прогулки · пешие маршруты</p><button class="home-cta" onclick="go(&quot;events&quot;)">▣ &nbsp; Выбрать мероприятие</button></div></section>';if(S.homeImage){const x=document.getElementById("home-screen");if(x)x.style.backgroundImage='linear-gradient(180deg,#063f3640 0%,#063f3640 38%,#031e19ee 100%),url("'+S.homeImage+'")'}}
async function events(){app.innerHTML='<div class="events-page"><div class="events-head"><h1>Мероприятия</h1><div class="route-tabs"><button class="route-tab active" onclick="filterEvents(\'sup\',this)">🏄 &nbsp; САП-СПЛАВЫ</button><button class="route-tab" onclick="filterEvents(\'hiking\',this)">🥾 &nbsp; ПЕШИЕ МАРШРУТЫ</button></div></div><div id="event-area" class="event-area"><div class="empty-state">Загрузка…</div></div></div>';try{const d=await api("/events");S.events=d.events||[];S.homeImage=d.home_image_url||"";const hs=document.getElementById("home-screen");if(hs&&S.homeImage)hs.style.backgroundImage='linear-gradient(180deg,#063f3640 0%,#063f3640 38%,#031e19ee 100%),url("'+S.homeImage+'")';drawEvents("sup")}catch(e){document.getElementById("event-area").innerHTML='<div class="empty-state error">⚠️ '+esc(e.message)+'</div>'}}
function filterEvents(type,btn){document.querySelectorAll(".route-tab").forEach(x=>x.classList.remove("active"));btn.classList.add("active");drawEvents(type)}
function drawEvents(type){const list=S.events.filter(e=>{const rt=String(e.type||e.route_type||"sup").toLowerCase();const title=String(e.route_title||e.template_name||"");const hiking=rt==="hiking"||rt==="пеший"||/пеш|поход|трек|трекинг|лес|гора|сопка/i.test(title);return type==="hiking"?hiking:!hiking});const area=document.getElementById("event-area");if(!area)return;if(!list.length){area.innerHTML='<div class="empty-state">Пока нет мероприятий этого типа.</div>';return}area.innerHTML='<div class="route-list">'+list.map((e,i)=>'<article class="event-card" style="--preview:url(\''+(e.image_url||('/assets/route-'+e.route_id+'.svg'))+'\')" onclick="bookStart('+e.id+')"><div class="event-visual"></div><div class="event-body"><h2>'+esc(e.route_title||e.template_name||"Мероприятие")+'</h2><div class="meta">📅 '+dt(e.event_date)+' · ⏰ '+esc(e.event_time)+'</div><div class="event-bottom"><div class="price">'+money(e.price)+' / чел.</div><div class="meta">Свободно: '+e.free_places+'</div></div><span class="event-arrow">›</span></div></article>').join("")+'</div>'}
async function bookStart(id){S.event=S.events.find(x=>x.id===id);S.showValidation=false;S.people=[{full_name:"",phone:"",children:false,comment:""}];try{const d=await api("/profile");if(d.phone)S.people[0].phone=d.phone}catch(e){}S.page="booking";render()}
function bookForm(){const e=S.event;if(!e){go("events");return}app.innerHTML='<div class="page"><div class="section-head"><h1>Запись</h1><button class="back-link" onclick="go(\'events\')">Назад</button></div><div class="card"><div class="title">'+esc(e.route_title)+'</div><p>📅 '+dt(e.event_date)+' · '+esc(e.event_time)+'<br>📍 '+esc(e.meeting_point||e.start_point||"—")+'<br>💰 '+money(e.price)+' за участника</p><div id="people"></div><button class="btn" onclick="addPerson()">➕ Добавить участника</button><button class="btn primary" onclick="sendBooking()">✅ Подтвердить заявку</button></div></div>';drawPeople()}
function drawPeople(){document.getElementById("people").innerHTML=S.people.map((p,i)=>'<div class="participant"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><b class="participant-title">Участник '+(i+1)+'</b>'+(i>0?'<button type="button" class="btn danger" style="width:auto;margin:0;padding:6px 9px;font-size:12px" onclick="removePerson('+i+')">🗑 Удалить</button>':'')+'</div><label>Имя и фамилия<input class="'+(S.showValidation&&!String(p.full_name||"").trim()?"invalid":"")+'" value="'+esc(p.full_name)+'" oninput="S.people['+i+'].full_name=this.value;this.classList.remove(\'invalid\')"></label><label>Телефон<input class="'+(S.showValidation&&!String(p.phone||"").trim()?"invalid":"")+'" type="tel" inputmode="tel" autocomplete="tel" value="'+esc(p.phone)+'" oninput="S.people['+i+'].phone=this.value;this.classList.remove(\'invalid\')"><button type="button" class="phone-action" onclick="requestPhone('+i+')">📱 Подставить мой номер из Telegram</button></label><label class="child-option"><input type="checkbox" '+(p.children?"checked":"")+' onchange="S.people['+i+'].children=this.checked">Ребёнок на SUP (+500 ₽)</label><label>Комментарий<textarea oninput="S.people['+i+'].comment=this.value">'+esc(p.comment)+'</textarea></label></div>').join("")}
function addPerson(){S.people.push({full_name:"",phone:"",children:false,comment:""});bookForm()}function requestPhone(i){try{if(!tg?.requestContact){throw Error("Telegram не поддерживает передачу контакта в этом окне")}tg.requestContact(ok=>{if(!ok)return;api("/profile").then(d=>{if(d.phone){S.people[i].phone=d.phone;bookForm()}}).catch(e=>alert(e.message||"Не удалось получить номер"))})}catch(e){alert(e.message||"Не удалось получить номер")}}
function removePerson(i){if(S.people.length<=1)return;if(!confirm("Убрать участника из заявки?"))return;S.people.splice(i,1);bookForm()}
async function sendBooking(){const normalized=S.people.map(p=>({...p,full_name:String(p.full_name||"").trim(),phone:(String(p.phone||"").replace(/\\D/g,"").replace(/^8/,"7").replace(/^(?=\\d{10}$)/,"7"))}));const bad=normalized.some(p=>!p.full_name||!/^7\\d{10}$/.test(p.phone));if(bad){S.showValidation=true;S.people=normalized;bookForm();setTimeout(()=>document.querySelector(".invalid")?.focus(),50);return}S.people=normalized;try{const d=await api("/bookings",{method:"POST",body:JSON.stringify({event_id:S.event.id,participants:S.people})});app.innerHTML='<div class="page"><div class="card center"><div class="title">🎉 Заявка принята!</div><p>Участников: '+d.count+'<br>💰 Итого: '+money(d.total)+'</p><p>Организатор свяжется с вами для подтверждения участия.</p><button class="btn primary" onclick="go(\'events\')">📅 К мероприятиям</button></div></div>'}catch(e){if(e.message==="Проверьте имя и телефон"){S.showValidation=true;bookForm();setTimeout(()=>document.querySelector(".invalid")?.focus(),50);return}app.innerHTML='<div class="page"><div class="card error">⚠️ '+esc(e.message)+'</div><button class="btn" onclick="bookForm()">⬅️ Вернуться</button></div>'}}
function contacts(){app.innerHTML='<div class="page"><div class="contacts-hero"><h1>Контакты</h1><p>Стирая границы, создавая моменты</p></div><div class="card"><div class="contact-row"><span class="contact-social-icon">☎</span><div><a href="tel:+79244160083" onclick="if(tg?.openLink){tg.openLink('tel:+79244160083');return false}">+7 924 416-00-83</a><div class="muted">Позвонить</div></div></div><div class="contact-row"><span class="contact-social-icon"><svg viewBox="0 0 24 24"><path d="M21.7 3.4 18.6 19c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3-1 .5.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L6 12.6l-4.9-1.5c-1.1-.3-1.1-1.1.2-1.6L20.4 3c.9-.3 1.7.2 1.3.4Z"/></svg></span><div><a href="https://t.me/wild_east_club" target="_blank" rel="noopener">@wild_east_club</a><div class="muted">Telegram</div></div></div><div class="contact-row"><span class="contact-social-icon"><svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7Zm5 3.5A4.5 4.5 0 1 1 12 16.5 4.5 4.5 0 0 1 12 7.5Zm0 2A2.5 2.5 0 1 0 12 14.5 2.5 2.5 0 0 0 12 9.5Zm5.2-2.3a1.05 1.05 0 1 1 0 2.1 1.05 1.05 0 0 1 0-2.1Z"/></svg></span><div><a href="https://instagram.com/wild_east_club" target="_blank" rel="noopener">@wild_east_club</a><div class="muted">Instagram</div></div></div></div><div class="card"><div class="title">Присоединяйся к приключениям!</div><p class="muted">SUP-прогулки, сплавы и пешие маршруты.</p></div><div class="card"><div class="muted">Разработка: <a href="https://t.me/spectran186" target="_blank" rel="noopener">@spectran186</a></div></div></div>'}
document.querySelectorAll(".nav-btn").forEach(b=>b.onclick=()=>go(b.dataset.page));api("/events").then(d=>{S.homeImage=d.home_image_url||"";S.events=d.events||[];render()}).catch(()=>render());
</script></body></html>
