<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wild East Club</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:var(--tg-theme-bg-color,#f4f6f8);--card:var(--tg-theme-secondary-bg-color,#fff);--text:var(--tg-theme-text-color,#111);--muted:var(--tg-theme-hint-color,#68707a);--accent:var(--tg-theme-button-color,#2481cc);--at:var(--tg-theme-button-text-color,#fff);--danger:#d33}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,sans-serif}.wrap{max-width:720px;margin:auto;padding:15px 13px 34px}.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;margin:4px 2px}.brand-logo{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none}.sub{color:var(--muted);margin:2px 2px 15px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:13px}.tab,.btn{border:0;border-radius:12px;padding:11px 13px;background:var(--card);color:var(--text);font:inherit}.tab.active,.primary{background:var(--accent);color:var(--at)}.tab{white-space:nowrap}.hidden{display:none}.card{background:var(--card);border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 1px 5px #0001}.title{font-size:18px;font-weight:750}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;margin:7px 0}.btn{width:100%;margin-top:9px;text-align:left}.primary{text-align:center}.danger{color:var(--danger)}input,textarea,select{width:100%;padding:12px;border:2px solid #9aa3ad;border-radius:11px;background:var(--card);color:var(--text);font:inherit;margin:5px 0 12px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent)}.field{margin:12px 0}.field-title{display:block;font-size:14px;font-weight:700;margin-bottom:5px}.phone-action{margin-top:7px;width:100%;padding:9px;border:1px dashed #8b949e;border-radius:10px;background:transparent;color:var(--accent);font:inherit;text-align:left}label{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.center{text-align:center}.small{font-size:13px}.status{font-weight:650}.success{color:#18834b}.error{color:var(--danger)}.participant{border:1px solid #0001;border-radius:13px;padding:11px;margin:8px 0}.sticky{position:sticky;bottom:8px}
</style></head><body><div class="wrap"><div class="brand"><img class="brand-logo" src="/assets/wild-east-club-logo.jpg" alt="Wild East Club"><span>Wild East Club</span></div><div class="sub">САП-прогулки и сплавы</div><div class="tabs"><button class="tab active" data-page="events">📅 Мероприятия</button><button class="tab" data-page="prices">💰 Цены</button><button class="tab" data-page="contacts">📞 Контакты</button><button class="tab" data-page="faq">❓ FAQ</button></div><main id="app">Загрузка…</main></div><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();history.pushState({app:true},"",location.href);window.addEventListener("popstate",function(){history.pushState({app:true},"",location.href);S.page="events";render()});if(tg&&tg.BackButton)tg.BackButton.onClick(function(){S.page="events";render()});const initData=tg?.initData||"",app=document.getElementById("app");const S={events:[],routes:[],page:"events",event:null,people:[],edit:null};window.addEventListener("error",e=>{if(app)app.innerHTML='<div class="card error">Ошибка JavaScript: '+esc(e.message||"Неизвестная ошибка")+'</div>'});window.addEventListener("unhandledrejection",e=>{if(app)app.innerHTML='<div class="card error">Ошибка: '+esc(String(e.reason?.message||e.reason||"Неизвестная ошибка"))+'</div>'});
const api=async(path,opt={})=>{const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),10000);try{const r=await fetch("/api"+path,{...opt,signal:ctrl.signal,cache:"no-store",headers:{"Content-Type":"application/json","X-Telegram-Init-Data":initData,...(opt.headers||{})}});const d=await r.json().catch(()=>({error:"Ошибка ответа"}));if(!r.ok)throw Error(d.error||("HTTP "+r.status));return d}catch(e){if(e.name==="AbortError")throw Error("Сервер не отвечает более 10 секунд");throw e}finally{clearTimeout(timer)}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));const money=v=>Number(v||0).toLocaleString("ru-RU")+" ₽";const dt=v=>{if(!v)return"—";const p=String(v).split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:v};const back=(page="admin")=>{S.page=page;render()};
function render(){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.page===S.page));if(S.page==="events")events();else if(S.page==="prices")app.innerHTML='<div class="card"><div class="title">💰 Стоимость</div><p>🌊 р. Кия<br>• Взрослый — 2500 ₽<br>• Взрослый + ребёнок — +500 ₽<br>• Со своим SUP — 500 ₽</p><p>🌅 Амур (закат)<br>• Взрослый — 1500 ₽<br>• Взрослый + ребёнок — +500 ₽</p></div>';else if(S.page==="contacts")app.innerHTML='<div class="card"><div class="title">📞 Контакты</div><p>Телефон: <a href="tel:+79244160083">+7 924 416-00-83</a></p><p>Telegram: <a href="https://t.me/wild_east_club" target="_blank" rel="noopener">@wild_east_club</a></p><p>Instagram: <a href="https://instagram.com/wild_east_club" target="_blank" rel="noopener">wild_east_club</a></p></div>';else if(S.page==="faq")app.innerHTML='<div class="card"><div class="title">❓ Частые вопросы</div><p>• Нужен ли опыт? — Нет.</p><p>• Выдают ли жилет? — Да.</p><p>• Можно с ребёнком? — Да.</p></div>';}
async function events(){try{const d=await api("/events");S.events=d.events||[];S.routes=d.routes||[];if(!S.events.length){app.innerHTML='<div class="card muted">Пока мероприятий нет.</div>';return}app.innerHTML=S.events.map(e=>'<div class="card"><div class="title">🛶 '+esc(e.route_title||"Маршрут")+'</div><div class="row"><span>📅 '+dt(e.event_date)+'</span><span>🕒 '+esc(e.event_time)+'</span></div><div class="row"><span>📍 '+esc(e.meeting_point||e.start_point||"—")+'</span><b>'+money(e.price)+'</b></div><div class="muted">Свободно: '+e.free_places+'</div><button class="btn primary" onclick="bookStart('+e.id+')">✅ Записаться</button></div>').join("")}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'</div>'}}
async function bookStart(id){S.event=S.events.find(x=>x.id===id);S.people=[{full_name:"",phone:"",children:false,comment:""}];try{const d=await api("/profile");if(d.phone)S.people[0].phone=d.phone}catch(e){}bookForm()}
function bookForm(){const e=S.event;app.innerHTML='<div class="card"><div class="title">📋 Запись</div><p>🛶 '+esc(e.route_title)+'<br>📅 '+dt(e.event_date)+' · '+esc(e.event_time)+'<br>📍 '+esc(e.meeting_point||e.start_point||"—")+'<br>💰 '+money(e.price)+' за участника</p><div id="people"></div><button class="btn" onclick="addPerson()">➕ Добавить участника</button><button class="btn primary" onclick="sendBooking()">✅ Подтвердить заявку</button><button class="btn" onclick="back(&quot;events&quot;)">⬅️ Назад к мероприятиям</button></div>';drawPeople()}
function drawPeople(){document.getElementById("people").innerHTML=S.people.map((p,i)=>'<div class="participant"><b>Участник '+(i+1)+'</b><label>Имя и фамилия<input value="'+esc(p.full_name)+'" oninput="S.people['+i+'].full_name=this.value"></label><label>Телефон<input inputmode="tel" value="'+esc(p.phone)+'" oninput="S.people['+i+'].phone=this.value"><button type="button" class="phone-action" onclick="requestPhone('+i+')">📱 Подставить мой номер из Telegram</button></label><label><input type="checkbox" '+(p.children?'checked':'')+' onchange="S.people['+i+'].children=this.checked"> Ребёнок на SUP (+500 ₽)</label><label>Комментарий<textarea oninput="S.people['+i+'].comment=this.value">'+esc(p.comment)+'</textarea></label></div>').join("")}
function addPerson(){S.people.push({full_name:"",phone:"",children:false,comment:""});bookForm()}
async function requestPhone(i){try{if(!tg||!tg.requestContact)throw Error("Автоматическая передача номера недоступна");const ok=await new Promise(function(resolve){tg.requestContact(resolve)});if(!ok)return;let d=null;for(let n=0;n<5;n++){try{d=await api("/profile");if(d.phone)break}catch(e){}await new Promise(function(resolve){setTimeout(resolve,700)})}if(d&&d.phone){S.people[i].phone=d.phone;drawPeople()}else{alert("Не удалось получить номер. Попробуйте ещё раз.")}}catch(e){alert(e.message||"Не удалось получить номер телефона")}}
async function sendBooking(){try{const d=await api("/bookings",{method:"POST",body:JSON.stringify({event_id:S.event.id,participants:S.people})});app.innerHTML='<div class="card center"><div class="title">🎉 Заявка принята!</div><p>Участников: '+d.count+'<br>💰 Итого: '+money(d.total)+'</p><p>Организатор свяжется с вами для подтверждения участия.</p><button class="btn primary" onclick="back(\'events\')">📅 К мероприятиям</button></div>'}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'</div><button class="btn" onclick="bookForm()">⬅️ Вернуться</button>'}}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{S.page=b.dataset.page;render()});events();
</script></body></html>
