<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wild East Club</title><script src="https://telegram.org/js/telegram-web-app.js?63"></script><style>:root{--bg:var(--tg-theme-bg-color,#f4f6f8);--card:var(--tg-theme-secondary-bg-color,#fff);--text:var(--tg-theme-text-color,#111);--muted:var(--tg-theme-hint-color,#6b7280);--accent:var(--tg-theme-button-color,#2481cc);--accentText:var(--tg-theme-button-text-color,#fff)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,sans-serif}.wrap{max-width:680px;margin:auto;padding:16px 14px 32px}.brand{font-size:25px;font-weight:800}.sub{color:var(--muted);margin:4px 0 18px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{border:0;border-radius:12px;padding:10px 14px;background:var(--card);color:var(--text);white-space:nowrap}.tab.active{background:var(--accent);color:var(--accentText)}.card{background:var(--card);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 1px 5px #0001}.title{font-size:18px;font-weight:750}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;margin:7px 0}button{font:inherit}.primary{width:100%;border:0;border-radius:13px;padding:13px;background:var(--accent);color:var(--accentText);font-weight:700;margin-top:12px}input,textarea,select{width:100%;padding:12px;border:1px solid #0002;border-radius:12px;background:var(--card);color:var(--text);font:inherit;margin:5px 0 10px}.hidden{display:none}.error{color:#c62828}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.admin-btn{border:0;border-radius:14px;background:var(--card);color:var(--text);padding:15px;text-align:left}</style></head><body><div class="wrap"><div class="brand">🌊 Wild East Club</div><div class="sub">САП-прогулки и сплавы</div><div class="tabs"><button class="tab active" data-page="events">Мероприятия</button><button class="tab" data-page="prices">Цены</button><button class="tab" data-page="contacts">Контакты</button><button class="tab" data-page="faq">FAQ</button><button class="tab hidden" id="adminTab" data-page="admin">Админ</button></div><main id="app">Загрузка…</main></div><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||"",app=document.getElementById("app"),adminTab=document.getElementById("adminTab");const state={events:[],routes:[],page:"events",event:null,participants:[]};
async function api(path,options={}){const r=await fetch("/api"+path,{...options,headers:{"Content-Type":"application/json","X-Telegram-Init-Data":initData,...(options.headers||{})}});const d=await r.json().catch(()=>({error:"Ошибка ответа сервера"}));if(!r.ok)throw new Error(d.error||"Ошибка запроса");return d}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function money(v){return Number(v||0).toLocaleString("ru-RU")+" ₽"}function date(v){if(!v)return "—";const p=v.split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:v}
async function load(){try{const d=await api("/events");state.events=d.events||[];state.routes=d.routes||[];if(d.isAdmin)adminTab.classList.remove("hidden");render()}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'</div>'}}
function render(){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page));if(state.page==="events")renderEvents();if(state.page==="prices")app.innerHTML='<div class="card"><div class="title">💰 Стоимость</div><p>🌊 р. Кия<br>• Взрослый — 2500 ₽<br>• Взрослый + ребёнок — +500 ₽<br>• Со своим SUP — 500 ₽</p><p>🌅 Амур (закат)<br>• Взрослый — 1500 ₽<br>• Взрослый + ребёнок — +500 ₽</p></div>';if(state.page==="contacts")app.innerHTML='<div class="card"><div class="title">📞 Контакты</div><p>Телефон: +7 924 416-00-83</p><p>Telegram: @wild_east_club</p><p>Instagram: wild_east_club</p></div>';if(state.page==="faq")app.innerHTML='<div class="card"><div class="title">❓ Частые вопросы</div><p>Нужен ли опыт? — Нет.</p><p>Выдают ли жилет? — Да.</p><p>Можно с ребёнком? — Да.</p></div>';if(state.page==="admin")renderAdmin()}
function renderEvents(){if(!state.events.length){app.innerHTML='<div class="card muted">Пока мероприятий нет.</div>';return}app.innerHTML=state.events.map(e=>'<div class="card"><div class="title">🛶 '+esc(e.route_title||"САП-сплав")+'</div><div class="row"><span>📅 '+date(e.event_date)+'</span><span>🕒 '+esc(e.event_time)+'</span></div><div class="row"><span>📍 '+esc(e.meeting_point||e.start_point||"—")+'</span><b>'+money(e.price)+'</b></div><div class="muted">Свободно: '+e.free_places+'</div><button class="primary" onclick="openBooking('+e.id+')">Записаться</button></div>').join("")}
function openBooking(id){state.event=state.events.find(e=>e.id===id);state.participants=[{full_name:"",phone:"",children:false,comment:""}];renderBooking()}
function renderBooking(){const e=state.event;app.innerHTML='<div class="card"><div class="title">Запись на мероприятие</div><p>🛶 '+esc(e.route_title)+'<br>📅 '+date(e.event_date)+' · '+esc(e.event_time)+'<br>📍 '+esc(e.meeting_point||e.start_point||"—")+'<br>💰 '+money(e.price)+'</p><div id="participants"></div><button class="primary" onclick="addParticipant()">➕ Добавить участника</button><button class="primary" onclick="submitBooking()">✅ Подтвердить заявку</button><button class="primary" style="background:transparent;color:var(--text)" onclick="state.page=\'events\';render()">← Назад</button></div>';renderParticipants()}
function renderParticipants(){document.getElementById("participants").innerHTML=state.participants.map((p,i)=>'<div class="card"><b>Участник '+(i+1)+'</b><label>Имя</label><input value="'+esc(p.full_name)+'" onchange="state.participants['+i+'].full_name=this.value"><label>Телефон</label><input inputmode="tel" value="'+esc(p.phone)+'" onchange="state.participants['+i+'].phone=this.value"><label><input type="checkbox" '+(p.children?'checked':'')+' onchange="state.participants['+i+'].children=this.checked"> Ребёнок с вами на SUP (+500 ₽)</label><label>Комментарий</label><textarea onchange="state.participants['+i+'].comment=this.value">'+esc(p.comment)+'</textarea></div>').join("")}
function addParticipant(){state.participants.push({full_name:"",phone:"",children:false,comment:""});renderBooking()}
async function submitBooking(){try{const d=await api("/bookings",{method:"POST",body:JSON.stringify({event_id:state.event.id,participants:state.participants})});app.innerHTML='<div class="card"><div class="title">🎉 Заявка принята!</div><p>Участников: '+d.count+'<br>💰 Итого: '+money(d.total)+'</p><p>Организатор свяжется с вами для подтверждения участия.</p></div>'}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'<button class="primary" onclick="renderBooking()">Вернуться</button></div>'}}
function renderAdmin(){app.innerHTML='<div class="card"><div class="title">👨‍💼 Админ-панель</div><div class="admin-grid"><button class="admin-btn" onclick="adminBookings()">📋 Заявки</button><button class="admin-btn" onclick="adminEvents()">📅 Мероприятия</button><button class="admin-btn" onclick="adminReports()">📊 Отчёты</button><button class="admin-btn" onclick="adminAddEvent()">➕ Добавить мероприятие</button></div></div>'}
async function adminBookings(){try{const d=await api("/admin/bookings");app.innerHTML='<div class="card"><div class="title">📋 Заявки</div>'+d.bookings.map(b=>'<div class="card"><b>'+esc(b.full_name)+'</b><br>📞 '+esc(b.phone)+'<br>🛶 '+esc(b.route_title)+'<br>📅 '+date(b.event_date)+' '+esc(b.event_time)+'<br>'+esc(b.status)+'<br><button class="primary" onclick="setStatus('+b.id+',\'confirmed\')">✅ Подтвердить</button><button class="primary" onclick="setStatus('+b.id+',\'cancelled\')">❌ Отменить</button></div>').join("")+'</div><button class="primary" onclick="state.page=\'admin\';render()">← Админ-панель</button>'}catch(e){app.innerHTML='<div class="card error">'+esc(e.message)+'</div>'}}
async function setStatus(id,status){await api("/admin/bookings/"+id,{method:"PATCH",body:JSON.stringify({status})});adminBookings()}
async function adminEvents(){const d=await api("/admin/events");app.innerHTML='<div class="card"><div class="title">📅 Мероприятия</div>'+d.events.map(e=>'<div class="card"><b>'+esc(e.route_title)+'</b><br>'+date(e.event_date)+' '+esc(e.event_time)+'<br>'+money(e.price)+'<br><button class="primary" onclick="editEvent('+e.id+')">✏️ Изменить</button></div>').join("")+'</div><button class="primary" onclick="adminAddEvent()">➕ Добавить</button><button class="primary" onclick="state.page=\'admin\';render()">← Назад</button>'}
function adminAddEvent(){app.innerHTML='<div class="card"><div class="title">➕ Новое мероприятие</div><label>Маршрут</label><select id="route">'+state.routes.map(r=>'<option value="'+r.id+'">'+esc(r.title)+'</option>').join("")+'</select><label>Дата</label><input id="date" placeholder="ДД.ММ.ГГГГ"><label>Время</label><input id="time" placeholder="10:00-13:00"><label>Цена</label><input id="price" inputmode="numeric" value="2500"><label>Точка встречи</label><input id="meeting"><button class="primary" onclick="saveEvent()">💾 Сохранить</button><button class="primary" onclick="state.page=\'admin\';render()">← Назад</button></div>'}
async function saveEvent(){const x={route_id:+route.value,event_date:date.value.split(".").reverse().join("-"),event_time:time.value,price:+price.value,meeting_point:meeting.value};try{await api("/admin/events",{method:"POST",body:JSON.stringify(x)});adminEvents()}catch(e){alert(e.message)}}
async function editEvent(id){const e=(await api("/admin/events")).events.find(x=>x.id===id);app.innerHTML='<div class="card"><div class="title">✏️ Мероприятие №'+id+'</div><label>Маршрут</label><select id="route">'+state.routes.map(r=>'<option value="'+r.id+'" '+(r.id===e.route_id?"selected":"")+'>'+esc(r.title)+'</option>').join("")+'</select><label>Дата</label><input id="date" value="'+date(e.event_date)+'"><label>Время</label><input id="time" value="'+esc(e.event_time)+'"><label>Цена</label><input id="price" value="'+e.price+'"><label>Точка встречи</label><input id="meeting" value="'+esc(e.meeting_point||"")+'"><button class="primary" onclick="updateEvent('+id+')">💾 Сохранить</button><button class="primary" onclick="deleteEvent('+id+')">🗑 Удалить</button><button class="primary" onclick="adminEvents()">← Назад</button></div>'}
async function updateEvent(id){await api("/admin/events/"+id,{method:"PUT",body:JSON.stringify({route_id:+route.value,event_date:date.value.split(".").reverse().join("-"),event_time:time.value,price:+price.value,meeting_point:meeting.value})});adminEvents()}
async function deleteEvent(id){if(confirm("Удалить мероприятие?")){await api("/admin/events/"+id,{method:"DELETE"});adminEvents()}}
async function adminReports(){const d=await api("/admin/reports");app.innerHTML='<div class="card"><div class="title">📊 Отчёты</div><p>Всего заявок: <b>'+d.total_bookings+'</b></p><p>Подтверждено: <b>'+d.confirmed+'</b></p><p>Новых: <b>'+d.new+'</b></p><p>Отменено: <b>'+d.cancelled+'</b></p></div><button class="primary" onclick="state.page=\'admin\';render()">← Назад</button>'}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});load();
</script></body></html>
