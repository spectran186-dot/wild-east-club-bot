<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wild East Club</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--green:#063f36;--green2:#0a5b4d;--yellow:#ffe600;--cream:#f5f4ee;--white:#fff;--text:#0b2b28;--muted:#687874;--line:#d8dfdc;--danger:#d83b3b}
*{box-sizing:border-box}html,body{margin:0;background:var(--cream);color:var(--text);font:15px/1.42 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding-bottom:76px}.wrap{max-width:760px;margin:auto;padding:0 14px 26px}
.brandbar{background:var(--green);color:#fff;margin:0 -14px 14px;padding:16px 18px 14px;border-radius:0 0 22px 22px;display:flex;align-items:center;gap:12px}.brand-logo{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#fff}.brand-name{font-size:21px;font-weight:900;letter-spacing:.4px}.brand-sub{font-size:12px;opacity:.86;margin-top:1px}
.hero{background:linear-gradient(145deg,#0b5549,#062f29);color:#fff;border-radius:22px;padding:22px 18px 20px;margin-bottom:14px;box-shadow:0 8px 24px #063f3630}.hero .eyebrow{font-size:12px;opacity:.78;text-transform:uppercase;letter-spacing:1px}.hero h1{font-size:28px;line-height:1.05;margin:7px 0}.hero p{margin:0;color:#e6eeeb}.hero .hero-btn{margin-top:17px;background:var(--yellow);color:#18251f;border:0;border-radius:14px;padding:13px 18px;font-weight:850;font-size:15px}
.filters{display:flex;gap:7px;overflow:auto;margin:0 0 12px}.filter{border:1px solid #c9d3cf;background:#fff;color:var(--text);border-radius:999px;padding:8px 16px;white-space:nowrap;font-weight:700}.filter.active{background:var(--yellow);border-color:var(--yellow)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 3px 14px #063f3610}.title{font-size:18px;font-weight:850}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;margin:7px 0}.btn{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px 13px;background:#fff;color:var(--text);font:inherit;font-weight:700;margin-top:9px;text-align:left}.primary{background:var(--green2);border-color:var(--green2);color:#fff;text-align:center}.yellow{background:var(--yellow);border-color:var(--yellow);color:#14251f;text-align:center}.danger{color:var(--danger)}input,textarea,select{width:100%;padding:12px;border:1.5px solid #aab8b3;border-radius:11px;background:#fff;color:var(--text);font:inherit;margin:5px 0 12px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--green2);box-shadow:0 0 0 3px #0a5b4d18}.field{margin:12px 0}.field-title{display:block;font-size:13px;font-weight:800;margin-bottom:4px}label{display:block;font-weight:650}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.center{text-align:center}.small{font-size:13px}.status{font-weight:750}.success{color:#16814a}.error{color:var(--danger)}.participant{border:1px solid #c8d2ce;border-radius:14px;padding:12px;margin:9px 0}.phone-action{margin-top:2px;width:100%;padding:9px;border:1px dashed #9eb0aa;border-radius:10px;background:#f2f7f4;color:var(--green2);font:inherit;text-align:left}.event-card{overflow:hidden;padding:0}.event-card-body{padding:14px}.event-strip{height:82px;background:linear-gradient(135deg,#0b5c4e,#83b6a5 55%,#e8d7a3);position:relative}.event-strip:after{content:"SUP";position:absolute;right:18px;bottom:9px;font-size:34px;font-weight:950;color:#fff8;letter-spacing:2px}.event-meta{font-size:13px;color:#50635e}.price{font-weight:900;white-space:nowrap}.back-btn{margin-top:8px}.contact-row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid #e2e7e4}.contact-icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#e9f2ee;font-size:20px}.contact-row a{color:var(--green2);font-weight:750;text-decoration:none}.bottom-nav{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #d7dfdc;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 -6px 20px #063f3612}.nav-btn{border:0;background:transparent;color:#60716d;font:12px inherit;font-weight:700;padding:4px}.nav-btn.active{color:var(--green2)}.nav-icon{display:block;font-size:19px;line-height:20px;margin-bottom:2px}.hidden{display:none}
@media(min-width:600px){.wrap{padding-left:18px;padding-right:18px}.brandbar{margin-left:-18px;margin-right:-18px}}
</style>/head><body><div class="wrap"><header class="brandbar"><img class="brand-logo" src="/assets/wild-east-club-logo.jpg" alt="Wild East Club"><div><div class="brand-name">WILD EAST CLUB</div><div class="brand-sub">СТИРАЯ ГРАНИЦЫ, СОЗДАВАЯ МОМЕНТЫ</div></div></header><main id="app">Загрузка…</main></div><nav class="bottom-nav"><button class="nav-btn active" data-page="events"><span class="nav-icon">⌂</span>Главная</button><button class="nav-btn" data-page="events"><span class="nav-icon">▣</span>Мероприятия</button><button class="nav-btn" data-page="contacts"><span class="nav-icon">⌕</span>Контакты</button></nav><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();history.pushState({app:true},"",location.href);window.addEventListener("popstate",function(){history.pushState({app:true},"",location.href);S.page="events";render()});if(tg&&tg.BackButton)tg.BackButton.onClick(function(){S.page="events";render()});const initData=tg?.initData||"",app=document.getElementById("app");const S={events:[],routes:[],page:"events",event:null,people:[],edit:null};window.addEventListener("error",e=>{if(app)app.innerHTML='<div class="card error">Ошибка JavaScript: '+esc(e.message||"Неизвестная ошибка")+'</div>'});window.addEventListener("unhandledrejection",e=>{if(app)app.innerHTML='<div class="card error">Ошибка: '+esc(String(e.reason?.message||e.reason||"Неизвестная ошибка"))+'</div>'});
const api=async(path,opt={})=>{const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),10000);try{const r=await fetch("/api"+path,{...opt,signal:ctrl.signal,cache:"no-store",headers:{"Content-Type":"application/json","X-Telegram-Init-Data":initData,...(opt.headers||{})}});const d=await r.json().catch(()=>({error:"Ошибка ответа"}));if(!r.ok)throw Error(d.error||("HTTP "+r.status));return d}catch(e){if(e.name==="AbortError")throw Error("Сервер не отвечает более 10 секунд");throw e}finally{clearTimeout(timer)}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));const money=v=>Number(v||0).toLocaleString("ru-RU")+" ₽";const dt=v=>{if(!v)return"—";const p=String(v).split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:v};const back=(page="admin")=>{S.page=page;render()};
function render(){document.querySelectorAll(".nav-btn").forEach(x=>x.classList.toggle("active",x.dataset.page===S.page));if(S.page==="events")events();else if(S.page==="prices")app.innerHTML='<div class="card"><div class="title">Стоимость</div><p><b>Кия</b><br>Взрослый — 2500 ₽<br>Взрослый + ребёнок — +500 ₽<br>Со своим SUP — 500 ₽</p><p><b>Амур — закат</b><br>Взрослый — 1500 ₽<br>Взрослый + ребёнок — +500 ₽</p></div>';else if(S.page==="contacts")app.innerHTML='<div class="card"><div class="title">Контакты</div><div class="contact-row"><span class="contact-icon">☎</span><div><a href="tel:+79244160083">+7 924 416-00-83</a><div class="small muted">Позвонить</div></div></div><div class="contact-row"><span class="contact-icon">➤</span><div><a href="https://t.me/wild_east_club" target="_blank" rel="noopener">@wild_east_club</a><div class="small muted">Telegram</div></div></div><div class="contact-row"><span class="contact-icon">◎</span><div><a href="https://instagram.com/wild_east_club" target="_blank" rel="noopener">@wild_east_club</a><div class="small muted">Instagram</div></div></div><div class="contact-row"><span class="contact-icon">●</span><div>Хабаровский край, Лазовский район<div class="small muted">Место проведения</div></div></div></div><div class="card"><div class="title">Присоединяйся к приключениям!</div><p class="muted">SUP-прогулки и сплавы по рекам Дальнего Востока.</p></div>';else if(S.page==="faq")app.innerHTML='<div class="card"><div class="title">Частые вопросы</div><p>• Нужен ли опыт? — Нет.</p><p>• Выдают ли жилет? — Да.</p><p>• Можно с ребёнком? — Да.</p></div>'}
async function events(){try{const d=await api("/events");S.events=d.events||[];S.routes=d.routes||[];if(!S.events.length){app.innerHTML='<div class="hero"><div class="eyebrow">WILD EAST CLUB</div><h1>SUP-прогулки<br>и сплавы</h1><p>по рекам Дальнего Востока</p></div><div class="card muted">Пока мероприятий нет.</div>';return}app.innerHTML='<section class="hero"><div class="eyebrow">WILD EAST CLUB</div><h1>SUP-прогулки<br>и сплавы</h1><p>по живописным рекам Дальнего Востока</p><button class="hero-btn" onclick="document.getElementById(\'events-list\').scrollIntoView({behavior:\'smooth\'})">Выбрать мероприятие →</button></section><div class="filters"><button class="filter active">Все</button><button class="filter">Кия</button><button class="filter">Амур</button></div><div id="events-list">'+S.events.map(e=>'<div class="card event-card"><div class="event-strip"></div><div class="event-card-body"><div class="row"><div><div class="title">'+esc(e.route_title||"Маршрут")+'</div><div class="event-meta">▣ '+dt(e.event_date)+' · '+esc(e.event_time)+'</div><div class="event-meta">⌖ '+esc(e.meeting_point||e.start_point||"—")+'</div></div><div class="price">'+money(e.price)+'</div></div><div class="muted small">Свободно мест: '+e.free_places+'</div><button class="btn yellow" onclick="bookStart('+e.id+')">Подробнее и записаться →</button></div></div>').join("")+'</div>'}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'</div>'}}
async function bookStart(id){S.event=S.events.find(x=>x.id===id);S.people=[{full_name:"",phone:"",children:false,comment:""}];try{const d=await api("/profile");if(d.phone)S.people[0].phone=d.phone}catch(e){}bookForm()}
function bookForm(){const e=S.event;app.innerHTML='<div class="card"><div class="title">📋 Запись</div><p>🛶 '+esc(e.route_title)+'<br>📅 '+dt(e.event_date)+' · '+esc(e.event_time)+'<br>📍 '+esc(e.meeting_point||e.start_point||"—")+'<br>💰 '+money(e.price)+' за участника</p><div id="people"></div><button class="btn" onclick="addPerson()">➕ Добавить участника</button><button class="btn primary" onclick="sendBooking()">✅ Подтвердить заявку</button><button class="btn" onclick="back(&quot;events&quot;)">⬅️ Назад к мероприятиям</button></div>';drawPeople()}
function drawPeople(){document.getElementById("people").innerHTML=S.people.map((p,i)=>'<div class="participant"><b>Участник '+(i+1)+'</b><label>Имя и фамилия<input value="'+esc(p.full_name)+'" oninput="S.people['+i+'].full_name=this.value"></label><label>Телефон<input inputmode="tel" value="'+esc(p.phone)+'" oninput="S.people['+i+'].phone=this.value"><button type="button" class="phone-action" onclick="requestPhone('+i+')">📱 Подставить мой номер из Telegram</button></label><label><input type="checkbox" '+(p.children?'checked':'')+' onchange="S.people['+i+'].children=this.checked"> Ребёнок на SUP (+500 ₽)</label><label>Комментарий<textarea oninput="S.people['+i+'].comment=this.value">'+esc(p.comment)+'</textarea></label></div>').join("")}
function addPerson(){S.people.push({full_name:"",phone:"",children:false,comment:""});bookForm()}
async function requestPhone(i){try{if(!tg||!tg.requestContact)throw Error("Автоматическая передача номера недоступна");const ok=await new Promise(function(resolve){tg.requestContact(resolve)});if(!ok)return;let d=null;for(let n=0;n<5;n++){try{d=await api("/profile");if(d.phone)break}catch(e){}await new Promise(function(resolve){setTimeout(resolve,700)})}if(d&&d.phone){S.people[i].phone=d.phone;drawPeople()}else{alert("Не удалось получить номер. Попробуйте ещё раз.")}}catch(e){alert(e.message||"Не удалось получить номер телефона")}}
async function sendBooking(){try{const d=await api("/bookings",{method:"POST",body:JSON.stringify({event_id:S.event.id,participants:S.people})});app.innerHTML='<div class="card center"><div class="title">🎉 Заявка принята!</div><p>Участников: '+d.count+'<br>💰 Итого: '+money(d.total)+'</p><p>Организатор свяжется с вами для подтверждения участия.</p><button class="btn primary" onclick="back(\'events\')">📅 К мероприятиям</button></div>'}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'</div><button class="btn" onclick="bookForm()">⬅️ Вернуться</button>'}}
document.querySelectorAll(".nav-btn").forEach(b=>b.onclick=()=>{S.page=b.dataset.page;render()});events();
</script></body></html>
