<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wild East Club</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:var(--tg-theme-bg-color,#f4f6f8);--card:var(--tg-theme-secondary-bg-color,#fff);--text:var(--tg-theme-text-color,#111);--muted:var(--tg-theme-hint-color,#68707a);--accent:var(--tg-theme-button-color,#2481cc);--at:var(--tg-theme-button-text-color,#fff);--danger:#d33}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,sans-serif}.wrap{max-width:720px;margin:auto;padding:15px 13px 34px}.brand{font-size:24px;font-weight:800;margin:4px 2px}.sub{color:var(--muted);margin:2px 2px 15px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:13px}.tab,.btn{border:0;border-radius:12px;padding:11px 13px;background:var(--card);color:var(--text);font:inherit}.tab.active,.primary{background:var(--accent);color:var(--at)}.tab{white-space:nowrap}.hidden{display:none}.card{background:var(--card);border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 1px 5px #0001}.title{font-size:18px;font-weight:750}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;margin:7px 0}.btn{width:100%;margin-top:9px;text-align:left}.primary{text-align:center}.danger{color:var(--danger)}input,textarea,select{width:100%;padding:12px;border:1px solid #0002;border-radius:11px;background:var(--card);color:var(--text);font:inherit;margin:4px 0 10px}label{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.center{text-align:center}.small{font-size:13px}.status{font-weight:650}.success{color:#18834b}.error{color:var(--danger)}.participant{border:1px solid #0001;border-radius:13px;padding:11px;margin:8px 0}.sticky{position:sticky;bottom:8px}
</style></head><body><div class="wrap"><div class="brand">🌊 Wild East Club</div><div class="sub">САП-прогулки и сплавы</div><div class="tabs"><button class="tab active" data-page="events">📅 Мероприятия</button><button class="tab" data-page="prices">💰 Цены</button><button class="tab" data-page="contacts">📞 Контакты</button><button class="tab" data-page="faq">❓ FAQ</button><button class="tab hidden" id="adminTab" data-page="admin">👨‍💼 Админ</button></div><main id="app">Загрузка…</main></div><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||"",app=document.getElementById("app"),adminTab=document.getElementById("adminTab");const S={events:[],routes:[],page:"events",event:null,people:[],edit:null};
const api=async(path,opt={})=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),10000);let r;try{r=await fetch("/api"+path,{...opt,signal:c.signal,cache:"no-store",headers:{"Content-Type":"application/json","X-Telegram-Init-Data":initData,...(opt.headers||{})}});const d=await r.json().catch(()=>({error:"Ошибка ответа"}));if(!r.ok)throw Error(d.error||("HTTP "+r.status));return d}finally{clearTimeout(t)}}catch(e){if(e.name==="AbortError")throw Error("Сервер не отвечает более 10 секунд");throw e}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));const money=v=>Number(v||0).toLocaleString("ru-RU")+" ₽";const dt=v=>{if(!v)return"—";const p=String(v).split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:v};const back=(page="admin")=>{S.page=page;render()};
function render(){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.page===S.page));if(S.page==="events")events();else if(S.page==="prices")app.innerHTML='<div class="card"><div class="title">💰 Стоимость</div><p>🌊 р. Кия<br>• Взрослый — 2500 ₽<br>• Взрослый + ребёнок — +500 ₽<br>• Со своим SUP — 500 ₽</p><p>🌅 Амур (закат)<br>• Взрослый — 1500 ₽<br>• Взрослый + ребёнок — +500 ₽</p></div>';else if(S.page==="contacts")app.innerHTML='<div class="card"><div class="title">📞 Контакты</div><p>Телефон: +7 924 416-00-83</p><p>Telegram: @wild_east_club</p><p>Instagram: wild_east_club</p></div>';else if(S.page==="faq")app.innerHTML='<div class="card"><div class="title">❓ Частые вопросы</div><p>• Нужен ли опыт? — Нет.</p><p>• Выдают ли жилет? — Да.</p><p>• Можно с ребёнком? — Да.</p></div>';else adminHome()}
async function events(){try{const d=await api("/events");S.events=d.events||[];S.routes=d.routes||[];if(d.isAdmin)adminTab.classList.remove("hidden");if(!S.events.length){app.innerHTML='<div class="card muted">Пока мероприятий нет.</div>';return}app.innerHTML=S.events.map(e=>'<div class="card"><div class="title">🛶 '+esc(e.route_title||"Маршрут")+'</div><div class="row"><span>📅 '+dt(e.event_date)+'</span><span>🕒 '+esc(e.event_time)+'</span></div><div class="row"><span>📍 '+esc(e.meeting_point||e.start_point||"—")+'</span><b>'+money(e.price)+'</b></div><div class="muted">Свободно: '+e.free_places+'</div><button class="btn primary" onclick="bookStart('+e.id+')">✅ Записаться</button></div>').join("")}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'</div>'}}
function bookStart(id){S.event=S.events.find(x=>x.id===id);S.people=[{full_name:"",phone:"",children:false,comment:""}];bookForm()}
function bookForm(){const e=S.event;app.innerHTML='<div class="card"><div class="title">📋 Запись</div><p>🛶 '+esc(e.route_title)+'<br>📅 '+dt(e.event_date)+' · '+esc(e.event_time)+'<br>📍 '+esc(e.meeting_point||e.start_point||"—")+'<br>💰 '+money(e.price)+' за участника</p><div id="people"></div><button class="btn" onclick="addPerson()">➕ Добавить участника</button><button class="btn primary" onclick="sendBooking()">✅ Подтвердить заявку</button><button class="btn" onclick="back('events')">⬅️ Назад к мероприятиям</button></div>';drawPeople()}
function drawPeople(){document.getElementById("people").innerHTML=S.people.map((p,i)=>'<div class="participant"><b>Участник '+(i+1)+'</b><label>Имя и фамилия<input value="'+esc(p.full_name)+'" oninput="S.people['+i+'].full_name=this.value"></label><label>Телефон<input inputmode="tel" value="'+esc(p.phone)+'" oninput="S.people['+i+'].phone=this.value"></label><label><input type="checkbox" '+(p.children?'checked':'')+' onchange="S.people['+i+'].children=this.checked"> Ребёнок на SUP (+500 ₽)</label><label>Комментарий<textarea oninput="S.people['+i+'].comment=this.value">'+esc(p.comment)+'</textarea></label></div>').join("")}
function addPerson(){S.people.push({full_name:"",phone:"",children:false,comment:""});bookForm()}
async function sendBooking(){try{const d=await api("/bookings",{method:"POST",body:JSON.stringify({event_id:S.event.id,participants:S.people})});app.innerHTML='<div class="card center"><div class="title">🎉 Заявка принята!</div><p>Участников: '+d.count+'<br>💰 Итого: '+money(d.total)+'</p><p>Организатор свяжется с вами для подтверждения участия.</p><button class="btn primary" onclick="back(\'events\')">📅 К мероприятиям</button></div>'}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'</div><button class="btn" onclick="bookForm()">⬅️ Вернуться</button>'}}
function adminHome(){app.innerHTML='<div class="card"><div class="title">👨‍💼 Административная панель</div><div class="grid"><button class="btn" onclick="bookings()">📋 Заявки</button><button class="btn" onclick="manualMenu()">➕ Внести заявку</button><button class="btn" onclick="reports()">📊 Отчёты</button><button class="btn" onclick="manageEvents()">📅 Мероприятия</button><button class="btn" onclick="manageRoutes()">🛶 Маршруты</button></div></div>'}
async function bookings(){try{const d=await api("/admin/bookings");const groups={};(d.bookings||[]).forEach(b=>(groups[b.event_id]??=[]).push(b));let h='<div class="card"><div class="title">📋 Заявки</div>';if(!Object.keys(groups).length)h+='<p class="muted">Заявок пока нет.</p>';for(const id in groups){const b=groups[id][0];h+='<button class="btn" onclick="eventBookings('+id+')">📅 '+dt(b.event_date)+' · '+esc(b.event_time)+'<br>🛶 '+esc(b.route_title)+'<br>👥 '+groups[id].length+'</button>'}h+='</div><button class="btn" onclick="back()">🏠 Админ-панель</button>';app.innerHTML=h}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'</div><button class="btn" onclick="back()">⬅️ Админ-панель</button>'}}
async function eventBookings(id){try{const d=await api("/admin/bookings"),bs=(d.bookings||[]).filter(b=>b.event_id==id);let h='<div class="card"><div class="title">📋 Заявки мероприятия</div>';for(const b of bs)h+='<div class="participant"><b>👤 '+esc(b.full_name)+'</b><br>📞 '+esc(b.phone)+'<br>📅 '+dt(b.event_date)+' · '+esc(b.event_time)+'<br>👶 Ребёнок: '+(b.children?'да':'нет')+(b.comment?'<br>💬 '+esc(b.comment):'')+'<br><span class="status">'+esc(b.status)+'</span>'+(b.status==="new"?'<button class="btn" onclick="statusBooking('+b.id+',\'confirmed\')">✅ Подтвердить</button><button class="btn danger" onclick="statusBooking('+b.id+',\'cancelled\')">❌ Отменить</button>':'')+'</div>';h+='</div><button class="btn" onclick="manual('+id+')">➕ Внести заявку вручную</button><button class="btn" onclick="bookings()">⬅️ Вернуться к выбору мероприятия</button><button class="btn" onclick="back()">🏠 Админ-панель</button>';app.innerHTML=h}catch(e){app.innerHTML='<div class="card error">'+esc(e.message)+'</div><button class="btn" onclick="bookings()">⬅️ Назад</button>'}}
async function statusBooking(id,status){await api("/admin/bookings/"+id,{method:"PATCH",body:JSON.stringify({status})});eventBookings((await api("/admin/bookings")).bookings.find(x=>x.id===id).event_id)}
async function manualMenu(){try{const d=await api("/admin/events"),es=d.events||[];let h='<div class="card"><div class="title">➕ Внести заявку вручную</div>';for(const e of es)h+='<button class="btn" onclick="manual('+e.id+')">📅 '+dt(e.event_date)+' · '+esc(e.event_time)+'<br>🛶 '+esc(e.route_title)+'</button>';h+='</div><button class="btn" onclick="back()">⬅️ Админ-панель</button>';app.innerHTML=h}catch(e){app.innerHTML='<div class="card error">'+esc(e.message)+'</div>'}}
async function manual(id){try{const d=await api("/admin/events"),e=(d.events||[]).find(x=>x.id==id);S.event=e||null;S.manualEventId=id;S.manual={name:"",phone:"",child:false};manualForm()}catch(e){alert(e.message)}}
function manualForm(){app.innerHTML='<div class="card"><div class="title">➕ Внести заявку вручную</div><p>Мероприятие: <b>'+esc(S.event?.route_title||"№"+S.manualEventId)+'</b><br>'+dt(S.event?.event_date)+' · '+esc(S.event?.event_time||"")+'</p><label>Имя и фамилия<input id="mn" value="'+esc(S.manual.name)+'"></label><label>Телефон<input id="mp" inputmode="tel" value="'+esc(S.manual.phone)+'"></label><label><input id="mc" type="checkbox"> Ребёнок с участником на SUP (+500 ₽)</label><button class="btn primary" onclick="saveManual()">💾 Добавить и подтвердить</button><button class="btn" onclick="manualMenu()">⬅️ Вернуться в добавление заявок</button><button class="btn" onclick="back()">🏠 Вернуться в админ-панель</button></div>'}
async function saveManual(){try{const d=await api("/admin/bookings/manual",{method:"POST",body:JSON.stringify({event_id:S.manualEventId,full_name:mn.value,phone:mp.value,children:mc.checked})});S.manual={name:"",phone:"",child:false};app.innerHTML='<div class="card"><div class="title">✅ Заявка добавлена</div><p>👤 '+esc(d.full_name)+'<br>📞 '+esc(d.phone)+'<br>👶 Ребёнок: '+(d.children?'да':'нет')+'<br>Статус: <b>Подтверждена</b></p><button class="btn" onclick="manual('+S.manualEventId+')">➕ Внести ещё в это мероприятие</button><button class="btn" onclick="manualMenu()">➕ Вернуться в добавление заявок</button><button class="btn" onclick="back()">🏠 Вернуться в админ-панель</button></div>'}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'</div><button class="btn" onclick="manualForm()">⬅️ Вернуться</button>'}}
async function manageEvents(){try{const d=await api("/admin/events"),es=d.events||[];let h='<div class="card"><div class="title">📅 Управление мероприятиями</div>';for(const e of es)h+='<div class="participant"><b>📅 '+dt(e.event_date)+' · '+esc(e.event_time)+'</b><br>🛶 '+esc(e.route_title)+'<br>💰 '+money(e.price)+'<button class="btn" onclick="editEvent('+e.id+')">✏️ Редактировать</button><button class="btn" onclick="copyEvent('+e.id+')">📋 Копировать</button></div>';h+='</div><button class="btn primary" onclick="addEvent()">➕ Добавить мероприятие</button><button class="btn" onclick="back()">⬅️ Админ-панель</button>';app.innerHTML=h}catch(e){app.innerHTML='<div class="card error">'+esc(e.message)+'</div><button class="btn" onclick="back()">⬅️ Назад</button>'}}
function eventForm(e={},copy=false){app.innerHTML='<div class="card"><div class="title">'+(e.id?(copy?'📋 Копировать мероприятие':'✏️ Редактировать мероприятие'):'➕ Добавить мероприятие')+'</div><label>Маршрут<select id="eroute">'+S.routes.map(r=>'<option value="'+r.id+'" '+(r.id==e.route_id?'selected':'')+'>'+esc(r.title)+'</option>').join("")+'</select></label><label>Дата<input id="edate" placeholder="ДД.ММ.ГГГГ" value="'+(e.event_date?dt(e.event_date):'')+'"></label><label>Время<input id="etime" placeholder="10:00-13:00" value="'+esc(e.event_time||'')+'"></label><label>Цена<input id="eprice" inputmode="numeric" value="'+(e.price||'')+'"></label><label>Количество мест<input id="emax" inputmode="numeric" value="'+(e.max_places||30)+'"></label><label>Точка встречи<input id="emeet" value="'+esc(e.meeting_point||'')+'"></label><button class="btn primary" onclick="'+(e.id&&!copy?'saveEdit('+e.id+')':'saveNew()')+'">💾 Сохранить</button>'+(e.id&&!copy?'<button class="btn danger" onclick="removeEvent('+e.id+')">🗑 Удалить</button>':'')+'<button class="btn" onclick="manageEvents()">⬅️ Вернуться к мероприятиям</button><button class="btn" onclick="back()">🏠 Админ-панель</button></div>'}
async function manageRoutes(){try{const d=await api("/admin/routes"),rs=d.routes||[];let x='<div class="card"><div class="title">🛶 Маршруты</div>';if(!rs.length)x+='<p class="muted">Маршрутов пока нет.</p>';for(const r of rs)x+='<div class="participant"><b>🛶 '+esc(r.title)+'</b><br>'+esc(r.start_point||'')+(r.finish_point?' → '+esc(r.finish_point):'')+'<br>💰 '+money(r.default_price)+'<button class="btn" onclick="editRoute('+r.id+')">✏️ Редактировать</button></div>';x+='</div><button class="btn primary" onclick="addRoute()">➕ Создать маршрут</button><button class="btn" onclick="back()">🏠 Админ-панель</button>';app.innerHTML=x}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'</div><button class="btn" onclick="back()">⬅️ Админ-панель</button>'}}
function routeForm(r={}){app.innerHTML='<div class="card"><div class="title">'+(r.id?'✏️ Редактировать маршрут':'➕ Создать маршрут')+'</div><label>Название<input id="rtitle" value="'+esc(r.title||'')+'"></label><label>Точка старта<input id="rstart" value="'+esc(r.start_point||'')+'"></label><label>Точка финиша<input id="rfinish" value="'+esc(r.finish_point||'')+'"></label><label>Описание<textarea id="rdesc">'+esc(r.description||'')+'</textarea></label><label>Продолжительность<input id="rduration" value="'+esc(r.duration||'')+'"></label><label>Цена по умолчанию<input id="rprice" inputmode="numeric" value="'+(r.default_price||'')+'"></label><button class="btn primary" onclick="'+(r.id?'saveRoute('+r.id+')':'saveRoute()')+'">💾 Сохранить</button><button class="btn" onclick="manageRoutes()">⬅️ Маршруты</button><button class="btn" onclick="back()">🏠 Админ-панель</button></div>'}
function addRoute(){routeForm()}
async function editRoute(id){const d=await api("/admin/routes");routeForm((d.routes||[]).find(r=>r.id==id)||{})}
async function saveRoute(id){try{const body={title:rtitle.value,start_point:rstart.value,finish_point:rfinish.value,description:rdesc.value,duration:rduration.value,default_price:+rprice.value||0};await api("/admin/routes"+(id?"/"+id:""),{method:id?"PUT":"POST",body:JSON.stringify(body)});manageRoutes()}catch(e){alert(e.message)}}
async function addEvent(){await api("/events").then(d=>{S.routes=d.routes||S.routes;eventForm()})}
async function editEvent(id){const d=await api("/admin/events");eventForm(d.events.find(e=>e.id==id)||{})}
async function copyEvent(id){const d=await api("/admin/events");eventForm(d.events.find(e=>e.id==id)||{},true)}
const dateOut=v=>{const p=v.split(".");return p.length===3?p.reverse().join("-"):v};
async function saveNew(){try{await api("/admin/events",{method:"POST",body:JSON.stringify({route_id:+eroute.value,event_date:dateOut(edate.value),event_time:etime.value,price:+eprice.value,max_places:+emax.value,meeting_point:emeet.value})});manageEvents()}catch(e){alert(e.message)}}
async function saveEdit(id){try{await api("/admin/events/"+id,{method:"PUT",body:JSON.stringify({route_id:+eroute.value,event_date:dateOut(edate.value),event_time:etime.value,price:+eprice.value,max_places:+emax.value,meeting_point:emeet.value})});manageEvents()}catch(e){alert(e.message)}}
async function removeEvent(id){if(confirm("Удалить мероприятие?")){await api("/admin/events/"+id,{method:"DELETE"});manageEvents()}}
async function reports(){try{const d=await api("/admin/reports");let h='<div class="card"><div class="title">📊 Отчёты</div>';if(!d.groups?.length)h+='<p class="muted">Заявок пока нет.</p>';for(const g of d.groups)h+='<button class="btn" onclick="report('+g.event_id+')">📊 '+dt(g.event_date)+' · '+esc(g.event_time)+'<br>🛶 '+esc(g.route_title)+'<br>👥 '+g.people+' · 🏄 '+g.boards+' · 💰 '+money(g.revenue)+'</button>';h+='</div><button class="btn" onclick="back()">⬅️ Админ-панель</button>';app.innerHTML=h}catch(e){app.innerHTML='<div class="card error">'+esc(e.message)+'</div>'}}
async function report(id){try{const d=await api("/admin/reports/"+id);let h='<div class="card"><div class="title">📊 Отчёт: '+esc(d.route_title)+'</div><p>📅 '+dt(d.event_date)+' · '+esc(d.event_time)+'</p>';for(const b of d.bookings)h+='<p>• '+esc(b.full_name)+' — '+esc(b.phone)+' · 👥 '+(1+b.children)+' · 🏄 1 · 💰 '+money(b.revenue)+'</p>';h+='<hr><b>👥 Людей: '+d.total_people+'</b><br><b>🏄 Досок: '+d.total_boards+'</b><br><b>💰 Выручка: '+money(d.total_revenue)+'</b></div><button class="btn" onclick="reports()">⬅️ Вернуться в выбор отчёта</button><button class="btn" onclick="back()">🏠 Админ-панель</button>';app.innerHTML=h}catch(e){app.innerHTML='<div class="card error">'+esc(e.message)+'</div><button class="btn" onclick="reports()">⬅️ Назад</button>'}}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{S.page=b.dataset.page;render()});events();
</script></body></html>
