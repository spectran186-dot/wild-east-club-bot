<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wild East Club — Админ-панель</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:var(--tg-theme-bg-color,#f4f6f8);--card:var(--tg-theme-secondary-bg-color,#fff);--text:var(--tg-theme-text-color,#111);--muted:var(--tg-theme-hint-color,#68707a);--accent:var(--tg-theme-button-color,#2481cc);--at:var(--tg-theme-button-text-color,#fff);--danger:#d33}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,sans-serif}.wrap{max-width:720px;margin:auto;padding:15px 13px 34px}.brand{font-size:24px;font-weight:800;margin:4px 2px}.sub{color:var(--muted);margin:2px 2px 15px}.card{background:var(--card);border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 1px 5px #0001}.title{font-size:18px;font-weight:750}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;margin:7px 0}.btn{width:100%;border:0;border-radius:12px;padding:11px 13px;background:var(--card);color:var(--text);font:inherit;margin-top:9px;text-align:left}.primary{background:var(--accent);color:var(--at);text-align:center}.danger{color:var(--danger)}input,textarea,select{width:100%;padding:12px;border:1px solid #0002;border-radius:11px;background:var(--card);color:var(--text);font:inherit;margin:4px 0 10px}label{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.center{text-align:center}.status{font-weight:650}.error{color:var(--danger)}.participant{border:1px solid #0001;border-radius:13px;padding:11px;margin:8px 0}
</style></head><body><div class="wrap"><div class="brand">👨‍💼 Wild East Club</div><div class="sub">Административная панель</div><main id="app">Загрузка…</main></div><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||"",app=document.getElementById("app");const S={events:[],routes:[],page:"admin",event:null,people:[],edit:null};
window.addEventListener("error",e=>{if(app)app.innerHTML='<div class="card error">Ошибка JavaScript: '+esc(e.message||"Неизвестная ошибка")+'</div>'});
window.addEventListener("unhandledrejection",e=>{if(app)app.innerHTML='<div class="card error">Ошибка: '+esc(String(e.reason?.message||e.reason||"Неизвестная ошибка"))+'</div>'});
const api=async(path,opt={})=>{const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),10000);try{const r=await fetch("/api"+path,{...opt,signal:ctrl.signal,cache:"no-store",headers:{"Content-Type":"application/json","X-Telegram-Init-Data":initData,...(opt.headers||{})}});const d=await r.json().catch(()=>({error:"Ошибка ответа"}));if(!r.ok)throw Error(d.error||("HTTP "+r.status));return d}catch(e){if(e.name==="AbortError")throw Error("Сервер не отвечает более 10 секунд");throw e}finally{clearTimeout(timer)}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));const money=v=>Number(v||0).toLocaleString("ru-RU")+" ₽";const dt=v=>{if(!v)return"—";const p=String(v).split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:v};const back=()=>adminHome();
id).event_id)}
async function manualMenu(){try{const d=await api("/admin/events"),es=d.events||[];let h='<div class="card"><div class="title">➕ Внести заявку вручную</div>';for(const e of es)h+='<button class="btn" onclick="manual('+e.id+')">📅 '+dt(e.event_date)+' · '+esc(e.event_time)+'<br>🛶 '+esc(e.route_title)+'</button>';h+='</div><button class="btn" onclick="back()">⬅️ Админ-панель</button>';app.innerHTML=h}catch(e){app.innerHTML='<div class="card error">'+esc(e.message)+'</div>'}}
function manual(id){S.event=S.events.find(x=>x.id==id)||null;S.manualEventId=id;S.manual={name:"",phone:"",child:false};manualForm()}
function manualForm(){app.innerHTML='<div class="card"><div class="title">➕ Внести заявку вручную</div><p>Мероприятие: <b>'+esc(S.event?.route_title||"№"+S.manualEventId)+'</b><br>'+dt(S.event?.event_date)+' · '+esc(S.event?.event_time||"")+'</p><label>Имя и фамилия<input id="mn" value="'+esc(S.manual.name)+'"></label><label>Телефон<input id="mp" inputmode="tel" value="'+esc(S.manual.phone)+'"></label><label><input id="mc" type="checkbox"> Ребёнок с участником на SUP (+500 ₽)</label><button class="btn primary" onclick="saveManual()">💾 Добавить и подтвердить</button><button class="btn" onclick="manualMenu()">⬅️ Вернуться в добавление заявок</button><button class="btn" onclick="back()">🏠 Вернуться в админ-панель</button></div>'}
async function saveManual(){try{const d=await api("/admin/bookings/manual",{method:"POST",body:JSON.stringify({event_id:S.manualEventId,full_name:mn.value,phone:mp.value,children:mc.checked})});S.manual={name:"",phone:"",child:false};app.innerHTML='<div class="card"><div class="title">✅ Заявка добавлена</div><p>👤 '+esc(d.full_name)+'<br>📞 '+esc(d.phone)+'<br>👶 Ребёнок: '+(d.children?'да':'нет')+'<br>Статус: <b>Подтверждена</b></p><button class="btn" onclick="manual('+S.manualEventId+')">➕ Внести ещё в это мероприятие</button><button class="btn" onclick="manualMenu()">➕ Вернуться в добавление заявок</button><button class="btn" onclick="back()">🏠 Вернуться в админ-панель</button></div>'}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'</div><button class="btn" onclick="manualForm()">⬅️ Вернуться</button>'}}
async function manageEvents(){try{const d=await api("/admin/events"),es=d.events||[];let h='<div class="card"><div class="title">📅 Управление мероприятиями</div>';for(const e of es)h+='<div class="participant"><b>📅 '+dt(e.event_date)+' · '+esc(e.event_time)+'</b><br>🛶 '+esc(e.route_title)+'<br>💰 '+money(e.price)+'<button class="btn" onclick="editEvent('+e.id+')">✏️ Редактировать</button><button class="btn" onclick="copyEvent('+e.id+')">📋 Копировать</button></div>';h+='</div><button class="btn primary" onclick="addEvent()">➕ Добавить мероприятие</button><button class="btn" onclick="back()">⬅️ Админ-панель</button>';app.innerHTML=h}catch(e){app.innerHTML='<div class="card error">'+esc(e.message)+'</div><button class="btn" onclick="back()">⬅️ Назад</button>'}}
function eventForm(e={},copy=false){app.innerHTML='<div class="card"><div class="title">'+(e.id?(copy?'📋 Копировать мероприятие':'✏️ Редактировать мероприятие'):'➕ Добавить мероприятие')+'</div><label>Маршрут<select id="eroute">'+S.routes.map(r=>'<option value="'+r.id+'" '+(r.id==e.route_id?'selected':'')+'>'+esc(r.title)+'</option>').join("")+'</select></label><label>Дата<input id="edate" placeholder="ДД.ММ.ГГГГ" value="'+(e.event_date?dt(e.event_date):'')+'"></label><label>Время<input id="etime" placeholder="10:00-13:00" value="'+esc(e.event_time||'')+'"></label><label>Цена<input id="eprice" inputmode="numeric" value="'+(e.price||'')+'"></label><label>Точка встречи<input id="emeet" value="'+esc(e.meeting_point||'')+'"></label><button class="btn primary" onclick="'+(e.id&&!copy?'saveEdit('+e.id+')':'saveNew('+(copy?1:0)+')')+'">💾 Сохранить</button>'+(e.id&&!copy?'<button class="btn danger" onclick="removeEvent('+e.id+')">🗑 Удалить</button>':'')+'<button class="btn" onclick="manageEvents()">⬅️ Вернуться к мероприятиям</button><button class="btn" onclick="back()">🏠 Админ-панель</button></div>'}
async function addEvent(){await api("/events").then(d=>{S.routes=d.routes||S.routes;eventForm()})}
async function editEvent(id){const d=await api("/admin/events");eventForm(d.events.find(e=>e.id==id)||{})}
async function copyEvent(id){const d=await api("/admin/events");eventForm(d.events.find(e=>e.id==id)||{},true)}
const dateOut=v=>{const p=v.split(".");return p.length===3?p.reverse().join("-"):v};
async function saveNew(){try{await api("/admin/events",{method:"POST",body:JSON.stringify({route_id:+eroute.value,event_date:dateOut(edate.value),event_time:etime.value,price:+eprice.value,meeting_point:emeet.value})});manageEvents()}catch(e){alert(e.message)}}
async function saveEdit(id){try{await api("/admin/events/"+id,{method:"PUT",body:JSON.stringify({route_id:+eroute.value,event_date:dateOut(edate.value),event_time:etime.value,price:+eprice.value,meeting_point:emeet.value})});manageEvents()}catch(e){alert(e.message)}}
async function removeEvent(id){if(confirm("Удалить мероприятие?")){await api("/admin/events/"+id,{method:"DELETE"});manageEvents()}}
async function reports(){try{const d=await api("/admin/reports");let h='<div class="card"><div class="title">📊 Отчёты</div>';if(!d.groups?.length)h+='<p class="muted">Заявок пока нет.</p>';for(const g of d.groups)h+='<button class="btn" onclick="report('+g.event_id+')">📊 '+dt(g.event_date)+' · '+esc(g.event_time)+'<br>🛶 '+esc(g.route_title)+'<br>👥 '+g.people+' · 🏄 '+g.boards+' · 💰 '+money(g.revenue)+'</button>';h+='</div><button class="btn" onclick="back()">⬅️ Админ-панель</button>';app.innerHTML=h}catch(e){app.innerHTML='<div class="card error">'+esc(e.message)+'</div>'}}
async function report(id){try{const d=await api("/admin/reports/"+id);let h='<div class="card"><div class="title">📊 Отчёт: '+esc(d.route_title)+'</div><p>📅 '+dt(d.event_date)+' · '+esc(d.event_time)+'</p>';for(const b of d.bookings)h+='<p>• '+esc(b.full_name)+' — '+esc(b.phone)+' · 👥 '+(1+b.children)+' · 🏄 1 · 💰 '+money(b.revenue)+'</p>';h+='<hr><b>👥 Людей: '+d.total_people+'</b><br><b>🏄 Досок: '+d.total_boards+'</b><br><b>💰 Выручка: '+money(d.total_revenue)+'</b></div><button class="btn" onclick="reports()">⬅️ Вернуться в выбор отчёта</button><button class="btn" onclick="back()">🏠 Админ-панель</button>';app.innerHTML=h}catch(e){app.innerHTML='<div class="card error">'+esc(e.message)+'</div><button class="btn" onclick="reports()">⬅️ Назад</button>'}}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{S.page=b.dataset.page;render()});events();

async function init(){try{const d=await api("/events");S.events=d.events||[];S.routes=d.routes||[];if(!d.isAdmin){app.innerHTML='<div class="card error">⛔ Нет доступа к административной панели.</div>';return}adminHome()}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'</div>'}}init();
</script></body></html>
