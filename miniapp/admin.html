<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wild East Club — Админ-панель</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--green:#063f36;--green2:#0a5b4d;--yellow:#ffe600;--cream:#f5f4ee;--white:#fff;--text:#0b2b28;--muted:#687874;--line:#d8dfdc;--danger:#d83b3b}
*{box-sizing:border-box}html,body{margin:0;background:var(--cream);color:var(--text);font:15px/1.42 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding-bottom:24px}.wrap{max-width:760px;margin:auto;padding:0 14px 30px}.brand{background:var(--green);color:#fff;margin:0 -14px 14px;padding:17px 18px;border-radius:0 0 22px 22px;display:flex;align-items:center;gap:12px}.brand-logo{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#fff}.brand-name{font-size:20px;font-weight:900}.sub{font-size:12px;opacity:.82;margin-top:2px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 3px 14px #063f3610}.title{font-size:19px;font-weight:850}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;margin:7px 0}.btn{width:100%;border:1px solid #cbd6d1;border-radius:12px;padding:11px 13px;background:#fff;color:var(--text);font:inherit;font-weight:700;margin-top:9px;text-align:left}.primary{background:var(--green2);border-color:var(--green2);color:#fff;text-align:center}.danger{color:var(--danger)}input,textarea,select{width:100%;padding:12px;border:1.5px solid #9eaea8;border-radius:11px;background:#fff;color:var(--text);font:inherit;margin:5px 0 12px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--green2);box-shadow:0 0 0 3px #0a5b4d18}label{display:block;font-weight:650}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.center{text-align:center}.small{font-size:13px}.status{font-weight:750}.success{color:#16814a}.error{color:var(--danger)}.participant{border:1px solid #c8d2ce;border-radius:14px;padding:12px;margin:9px 0;background:#fff}.menu-stack{display:flex;flex-direction:column;gap:8px;margin-top:13px}.menu-stack .btn{margin:0;border-color:#cbd8d3;padding:13px 14px;background:#fbfcfa}.menu-stack .btn:first-child,.menu-stack .btn:nth-child(3){border-left:5px solid var(--green2)}.compact-actions{display:flex;gap:7px;margin-t </style>/head><body><div class="wrap"><header class="brand"><img class="brand-logo" src="/assets/wild-east-club-logo.jpg" alt="Wild East Club"><div><div class="brand-name">WILD EAST CLUB · АДМИН</div><div class="sub">СТИРАЯ ГРАНИЦЫ, СОЗДАВАЯ МОМЕНТЫ</div></div></header><main id="app">Загрузка…</main></div><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();history.pushState({admin:true},"",location.href);window.addEventListener("popstate",()=>{history.pushState({admin:true},"",location.href);adminHome()});tg?.BackButton?.onClick(()=>adminHome());const initData=tg?.initData||"",app=document.getElementById("app"),adminTab=document.getElementById("adminTab");const S={events:[],routes:[],page:"events",event:null,people:[],edit:null};window.addEventListener("error",e=>{if(app)app.innerHTML='<div class="card error">Ошибка JavaScript: '+esc(e.message||"Неизвестная ошибка")+'</div>'});window.addEventListener("unhandledrejection",e=>{if(app)app.innerHTML='<div class="card error">Ошибка: '+esc(String(e.reason?.message||e.reason||"Неизвестная ошибка"))+'</div>'});
const api=async(path,opt={})=>{const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),10000);try{const r=await fetch("/api"+path,{...opt,signal:ctrl.signal,cache:"no-store",headers:{"Content-Type":"application/json","X-Telegram-Init-Data":initData,...(opt.headers||{})}});const d=await r.json().catch(()=>({error:"Ошибка ответа"}));if(!r.ok)throw Error(d.error||("HTTP "+r.status));return d}catch(e){if(e.name==="AbortError")throw Error("Сервер не отвечает более 10 секунд");throw e}finally{clearTimeout(timer)}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));const money=v=>Number(v||0).toLocaleString("ru-RU")+" ₽";const dt=v=>{if(!v)return"—";const p=String(v).split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:v};const back=(page="admin")=>{S.page=page;render()};
function render(){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.page===S.page));if(S.page==="events")events();else if(S.page==="prices")app.innerHTML='<div class="card"><div class="title">💰 Стоимость</div><p>🌊 р. Кия<br>• Взрослый — 2500 ₽<br>• Взрослый + ребёнок — +500 ₽<br>• Со своим SUP — 500 ₽</p><p>🌅 Амур (закат)<br>• Взрослый — 1500 ₽<br>• Взрослый + ребёнок — +500 ₽</p></div>';else if(S.page==="contacts")app.innerHTML='<div class="card"><div class="title">📞 Контакты</div><p>Телефон: <a href="tel:+79244160083">+7 924 416-00-83</a></p><p>Telegram: <a href="https://t.me/wild_east_club" target="_blank">@wild_east_club</a></p><p>Instagram: <a href="https://instagram.com/wild_east_club" target="_blank">wild_east_club</a></p></div>';else if(S.page==="faq")app.innerHTML='<div class="card"><div class="title">❓ Частые вопросы</div><p>• Нужен ли опыт? — Нет.</p><p>• Выдают ли жилет? — Да.</p><p>• Можно с ребёнком? — Да.</p></div>';else adminHome()}
async function events(){try{const d=await api("/events");S.events=d.events||[];S.routes=d.routes||[];if(d.isAdmin)adminTab.classList.remove("hidden");if(!S.events.length){app.innerHTML='<div class="card muted">Пока мероприятий нет.</div>';return}app.innerHTML=S.events.map(e=>'<div class="card"><div class="title">🛶 '+esc(e.route_title||"Маршрут")+'</div><div class="row"><span>📅 '+dt(e.event_date)+'</span><span>🕒 '+esc(e.event_time)+'</span></div><div class="row"><span>📍 '+esc(e.meeting_point||e.start_point||"—")+'</span><b>'+money(e.price)+'</b></div><div class="muted">Свободно: '+e.free_places+'</div><button class="btn primary" onclick="bookStart('+e.id+')">✅ Записаться</button></div>').join("")}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'</div>'}}
function bookStart(id){S.event=S.events.find(x=>x.id===id);S.people=[{full_name:"",phone:"",children:false,comment:""}];bookForm()}
function bookForm(){const e=S.event;app.innerHTML='<div class="card"><div class="title">📋 Запись</div><p>🛶 '+esc(e.route_title)+'<br>📅 '+dt(e.event_date)+' · '+esc(e.event_time)+'<br>📍 '+esc(e.meeting_point||e.start_point||"—")+'<br>💰 '+money(e.price)+' за участника</p><div id="people"></div><button class="btn" onclick="addPerson()">➕ Добавить участника</button><button class="btn primary" onclick="sendBooking()">✅ Подтвердить заявку</button><button class="btn" onclick="back(&quot;events&quot;)">⬅️ Назад к мероприятиям</button></div>';drawPeople()}
function drawPeople(){document.getElementById("people").innerHTML=S.people.map((p,i)=>'<div class="participant"><b>Участник '+(i+1)+'</b><label>Имя и фамилия<input value="'+esc(p.full_name)+'" oninput="S.people['+i+'].full_name=this.value"></label><label>Телефон<input inputmode="tel" value="'+esc(p.phone)+'" oninput="S.people['+i+'].phone=this.value"></label><label><input type="checkbox" '+(p.children?'checked':'')+' onchange="S.people['+i+'].children=this.checked"> Ребёнок на SUP (+500 ₽)</label><label>Комментарий<textarea oninput="S.people['+i+'].comment=this.value">'+esc(p.comment)+'</textarea></label></div>').join("")}
function addPerson(){S.people.push({full_name:"",phone:"",children:false,comment:""});bookForm()}
async function sendBooking(){try{const d=await api("/bookings",{method:"POST",body:JSON.stringify({event_id:S.event.id,participants:S.people})});app.innerHTML='<div class="card center"><div class="title">🎉 Заявка принята!</div><p>Участников: '+d.count+'<br>💰 Итого: '+money(d.total)+'</p><p>Организатор свяжется с вами для подтверждения участия.</p><button class="btn primary" onclick="back(\'events\')">📅 К мероприятиям</button></div>'}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'</div><button class="btn" onclick="bookForm()">⬅️ Вернуться</button>'}}
 S.page="admin";function adminHome(){app.innerHTML='<div class="card"><div class="title">👨‍💼 Административная панель</div><div class="menu-stack"><button class="btn" onclick="bookings()">📋 Заявки</button><button class="btn" onclick="manualMenu()">➕ Внести заявку</button><button class="btn" onclick="reports()">📊 Отчёты</button><button class="btn" onclick="manageEvents()">📅 Мероприятия</button></div></div>'}
async function bookings(){try{const d=await api("/admin/bookings");const groups={};(d.bookings||[]).forEach(b=>(groups[b.event_id]??=[]).push(b));let h='<div class="card"><div class="title">📋 Заявки</div>';if(!Object.keys(groups).length)h+='<p class="muted">Заявок пока нет.</p>';for(const id in groups){const b=groups[id][0];h+='<button class="btn" onclick="eventBookings('+id+')">📅 '+dt(b.event_date)+' · '+esc(b.event_time)+'<br>🛶 '+esc(b.route_title)+'<br>👥 '+groups[id].length+'</button>'}h+='</div><button class="btn" onclick="back()">🏠 Админ-панель</button>';app.innerHTML=h}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'</div><button class="btn" onclick="back()">⬅️ Админ-панель</button>'}}
async function eventBookings(id){try{const d=await api("/admin/bookings"),bs=(d.bookings||[]).filter(b=>b.event_id==id);const first=bs[0]||{};let h='<div class="card event-head"><div class="title">📋 Заявки мероприятия</div><p><b>🛶 '+esc(first.route_title||"Мероприятие")+'</b><br>📅 '+dt(first.event_date)+' · '+esc(first.event_time||"")+'</p></div><div class="card">';for(const b of bs){h+='<div class="participant"><b>👤 '+esc(b.full_name)+'</b><br>📞 <a class="phone-link" href="tel:'+esc(b.phone)+'">'+esc(b.phone)+'</a>'+(b.children?'<br>👶 Ребёнок: да':'')+(b.comment?'<br>💬 '+esc(b.comment):'')+'<br><span class="status">'+(b.status==="confirmed"?'✅ подтвержден':b.status==="cancelled"||b.status==="canceled"?'❌ отменен':esc(b.status))+'</span>';if(b.status==="new"){h+='<button class="btn" onclick="statusBooking('+b.id+',&#39;confirmed&#39;)">✅ Подтвердить</button><button class="btn danger" onclick="statusBooking('+b.id+',&#39;cancelled&#39;)">❌ Отменить</button>'}h+='</div>'}h+='</div><button class="btn" onclick="manual('+id+')">➕ Внести заявку вручную</button><button class="btn" onclick="bookings()">⬅️ Вернуться к выбору мероприятия</button><button class="btn" onclick="back()">🏠 Админ-панель</button>';app.innerHTML=h}catch(e){app.innerHTML='<div class="card error">'+esc(e.message)+'</div><button class="btn" onclick="bookings()">⬅️ Назад</button>'}}
async function statusBooking(id,status){await api("/admin/bookings/"+id,{method:"PATCH",body:JSON.stringify({status})});eventBookings((await api("/admin/bookings")).bookings.find(x=>x.id===id).event_id)}
async function manualMenu(){try{const d=await api("/admin/events"),es=d.events||[];let h='<div class="card"><div class="title">➕ Внести заявку вручную</div>';for(const e of es)h+='<button class="btn" onclick="manual('+e.id+')">📅 '+dt(e.event_date)+' · '+esc(e.event_time)+'<br>🛶 '+esc(e.route_title)+'</button>';h+='</div><button class="btn" onclick="back()">⬅️ Админ-панель</button>';app.innerHTML=h}catch(e){app.innerHTML='<div class="card error">'+esc(e.message)+'</div>'}}
function manual(id){S.event=S.events.find(x=>x.id==id)||null;S.manualEventId=id;S.manual={name:"",phone:"",child:false};manualForm()}
function manualForm(){app.innerHTML='<div class="card"><div class="title">➕ Внести заявку вручную</div><p>Мероприятие: <b>'+esc(S.event?.route_title||"№"+S.manualEventId)+'</b><br>'+dt(S.event?.event_date)+' · '+esc(S.event?.event_time||"")+'</p><label>Имя и фамилия<input id="mn" value="'+esc(S.manual.name)+'"></label><label>Телефон<input id="mp" inputmode="tel" value="'+esc(S.manual.phone)+'"></label><label><input id="mc" type="checkbox"> Ребёнок с участником на SUP (+500 ₽)</label><button class="btn primary" onclick="saveManual()">💾 Добавить и подтвердить</button><button class="btn" onclick="manualMenu()">⬅️ Вернуться в добавление заявок</button><button class="btn" onclick="back()">🏠 Вернуться в админ-панель</button></div>'}
async function saveManual(){try{const d=await api("/admin/bookings/manual",{method:"POST",body:JSON.stringify({event_id:S.manualEventId,full_name:mn.value,phone:mp.value,children:mc.checked})});S.manual={name:"",phone:"",child:false};app.innerHTML='<div class="card"><div class="title">✅ Заявка добавлена</div><p>👤 '+esc(d.full_name)+'<br>📞 '+esc(d.phone)+'<br>👶 Ребёнок: '+(d.children?'да':'нет')+'<br>Статус: <b>Подтверждена</b></p><button class="btn" onclick="manual('+S.manualEventId+')">➕ Внести ещё в это мероприятие</button><button class="btn" onclick="manualMenu()">➕ Вернуться в добавление заявок</button><button class="btn" onclick="back()">🏠 Вернуться в админ-панель</button></div>'}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'</div><button class="btn" onclick="manualForm()">⬅️ Вернуться</button>'}}
async function manageEvents(){try{const d=await api("/admin/events"),es=d.events||[];let h='<div class="card"><div class="title">📅 Мероприятия</div><p class="muted">Создавайте шаблоны отдельно, а затем используйте их для добавления конкретных дат.</p><button class="btn primary" onclick="manageTemplates()">🧩 Шаблоны мероприятий</button></div><div class="card"><div class="title">📅 Запланированные мероприятия</div>';if(!es.length)h+='<p class="muted">Пока мероприятий нет.</p>';for(const ev of es)h+='<div class="participant"><b>📅 '+dt(ev.event_date)+' · '+esc(ev.event_time)+'</b><br>🛶 '+esc(ev.route_title)+'<br>💰 '+money(ev.price)+'<div class="compact-actions"><button class="btn" onclick="editEvent('+ev.id+')">✏️ Изменить</button><button class="btn" onclick="copyEvent('+ev.id+')">📋 Копия</button></div></div>';h+='</div><button class="btn primary" onclick="addEvent()">➕ Добавить мероприятие</button><button class="btn" onclick="back()">⬅️ Админ-панель</button>';app.innerHTML=h}catch(e){app.innerHTML='<div class="card error">'+esc(e.message)+'</div><button class="btn" onclick="back()">⬅️ Назад</button>'}}

async function manageTemplates(){try{const d=await api("/admin/event-templates"),ts=d.templates||[];let h='<div class="card"><div class="title">🧩 Шаблоны мероприятий</div><p class="muted">Шаблон хранит маршрут, стандартное время, цену, лимит мест и точку встречи.</p>';if(!ts.length)h+='<p class="muted">Шаблонов пока нет.</p>';for(const t of ts)h+='<div class="participant"><b>🧩 '+esc(t.name)+'</b><br>🛶 '+esc(t.route_title)+'<br>🕒 '+esc(t.event_time)+' · 💰 '+money(t.price)+' · 👥 '+Number(t.max_places||30)+'<br>📍 '+esc(t.meeting_point||"—")+'<div class="compact-actions"><button class="btn" onclick="editTemplate('+t.id+')">✏️ Изменить</button><button class="btn danger" onclick="removeTemplate('+t.id+')">🗑 Удалить</button></div></div>';h+='</div><button class="btn primary" onclick="templateForm()">➕ Создать шаблон мероприятия</button><button class="btn" onclick="manageEvents()">⬅️ К мероприятиям</button>';app.innerHTML=h}catch(e){app.innerHTML='<div class="card error">'+esc(e.message)+'</div><button class="btn" onclick="manageEvents()">⬅️ Назад</button>'}}

async function templateForm(t={},copy=false){try{const d=await api("/admin/routes"),routes=d.routes||[];app.innerHTML='<div class="card"><div class="title">'+(t.id&&!copy?'✏️ Редактировать шаблон':'🧩 Создать шаблон мероприятия')+'</div><label>Название шаблона<input id="tname" value="'+esc(t.name||'')+'" placeholder="Например: Кия — утренний сплав"></label><label>Маршрут<select id="troute" onchange="toggleTemplateNewRoute()"><option value="">— Выбрать маршрут —</option>'+routes.map(r=>'<option value="'+r.id+'" '+(r.id==t.route_id?'selected':'')+'>⭐ '+esc(r.title)+'</option>').join("")+'<option value="__new__">➕ Создать новый маршрут</option></select></label><div id="templatenewroute" class="hidden"><label>Название нового маршрута<input id="trtitle" placeholder="Например: Кия — Гродеково → Могилёвка"></label><label>Тип маршрута<select id="trtype"><option value="sup">🛶 САП-сплав</option><option value="hiking">🥾 Пеший маршрут</option></select></label><div class="grid"><label>Точка старта<input id="trstart"></label><label>Точка финиша<input id="trfinish"></label></div><label>Описание<textarea id="trdesc"></textarea></label><label>Продолжительность<input id="trduration" placeholder="3–4 часа"></label><label>Цена по умолчанию<input id="trprice" inputmode="numeric"></label></div><label>Время<input id="ttime" value="'+esc(t.event_time||'')+'" placeholder="10:00-13:00"></label><label>Цена<input id="tprice" inputmode="numeric" value="'+(t.price||'')+'"></label><label>Максимум участников<input id="tmax" inputmode="numeric" value="'+(t.max_places||30)+'"></label><label>Точка встречи<input id="tmeet" value="'+esc(t.meeting_point||'')+'"></label><button class="btn primary" onclick="'+(t.id&&!copy?'saveTemplate('+t.id+')':'saveTemplateNew()')+'">💾 Сохранить шаблон</button>'+(t.id&&!copy?'<button class="btn danger" onclick="removeTemplate('+t.id+')">🗑 Удалить</button>':'')+'<button class="btn" onclick="manageTemplates()">⬅️ К шаблонам</button></div>';toggleTemplateNewRoute()}catch(e){app.innerHTML='<div class="card error">'+esc(e.message)+'</div><button class="btn" onclick="manageTemplates()">⬅️ Назад</button>'}}

function toggleTemplateNewRoute(){const n=document.getElementById("templatenewroute"),v=document.getElementById("troute")?.value;if(v==="__new__")n?.classList.remove("hidden");else n?.classList.add("hidden")}
async function saveTemplateRoute(){if(troute.value!=="__new__")return +troute.value;const title=trtitle.value.trim();if(!title)throw Error("Укажите название нового маршрута");const d=await api("/admin/routes",{method:"POST",body:JSON.stringify({title,type:trtype.value,start_point:trstart.value,finish_point:trfinish.value,description:trdesc.value,duration:trduration.value,default_price:+trprice.value||0})});return d.id}
async function saveTemplateNew(){try{const routeId=await saveTemplateRoute();if(!routeId)throw Error("Выберите маршрут");await api("/admin/event-templates",{method:"POST",body:JSON.stringify({name:tname.value,route_id:routeId,event_time:ttime.value,price:+tprice.value,max_places:+tmax.value||30,meeting_point:tmeet.value})});manageTemplates()}catch(e){alert(e.message)}}
async function editTemplate(id){const d=await api("/admin/event-templates");const t=(d.templates||[]).find(x=>x.id==id);if(t)templateForm(t)}
async function saveTemplate(id){try{if(troute.value==="__new__")throw Error("Для редактирования выберите существующий маршрут");await api("/admin/event-templates/"+id,{method:"PUT",body:JSON.stringify({name:tname.value,route_id:+troute.value,event_time:ttime.value,price:+tprice.value,max_places:+tmax.value||30,meeting_point:tmeet.value})});manageTemplates()}catch(e){alert(e.message)}}
async function removeTemplate(id){if(confirm("Удалить шаблон мероприятия?")){await api("/admin/event-templates/"+id,{method:"DELETE"});manageTemplates()}}

async function addEvent(){try{const d=await api("/admin/event-templates");S.templates=d.templates||[];if(!S.templates.length){alert("Сначала создайте шаблон мероприятия.");manageTemplates();return}eventForm({},false)}catch(e){alert(e.message)}}
async function editEvent(id){const d=await api("/admin/events"),t=d.events.find(e=>e.id==id);S.templates=(await api("/admin/event-templates")).templates||[];eventForm(t||{},false)}
async function copyEvent(id){const d=await api("/admin/events"),t=d.events.find(e=>e.id==id);S.templates=(await api("/admin/event-templates")).templates||[];eventForm(t||{},true)}

function eventForm(e={},copy=false){const ts=S.templates||[];let selected="";if(e.route_id){const exact=ts.find(t=>Number(t.route_id)===Number(e.route_id)&&String(t.event_time)===String(e.event_time)&&Number(t.price)===Number(e.price));selected=exact?exact.id:(ts.find(t=>Number(t.route_id)===Number(e.route_id))?.id||"")}app.innerHTML='<div class="card"><div class="title">'+(e.id?(copy?'📋 Копировать мероприятие':'✏️ Редактировать мероприятие'):'➕ Добавить мероприятие')+'</div><label>Шаблон мероприятия<select id="etemplate" onchange="applyEventTemplate()"><option value="">— Выбрать шаблон —</option>'+ts.map(t=>'<option value="'+t.id+'" '+(t.id==selected?'selected':'')+'>'+esc(t.name)+' · '+esc(t.event_time)+' · '+money(t.price)+'</option>').join("")+'</select></label><label>Дата<input id="edate" type="date" value="'+(e.event_date||'')+'"></label><label>Время<input id="etime" placeholder="10:00-13:00" value="'+esc(e.event_time||'')+'"></label><label>Цена<input id="eprice" inputmode="numeric" value="'+(e.price||'')+'"></label><label>Максимум участников<input id="emax" inputmode="numeric" value="'+(e.max_places||30)+'"></label><label>Точка встречи<input id="emeet" value="'+esc(e.meeting_point||'')+'"></label><button class="btn primary" onclick="'+(e.id&&!copy?'saveEdit('+e.id+')':'saveNew()')+'">💾 Сохранить</button>'+(e.id&&!copy?'<button class="btn danger" onclick="removeEvent('+e.id+')">🗑 Удалить</button>':'')+'<button class="btn" onclick="manageEvents()">⬅️ Вернуться к мероприятиям</button><button class="btn" onclick="back()">🏠 Админ-панель</button></div>'}

function applyEventTemplate(){const t=(S.templates||[]).find(x=>Number(x.id)===Number(etemplate.value));if(!t)return;etime.value=t.event_time||"";eprice.value=t.price||0;emax.value=t.max_places||30;emeet.value=t.meeting_point||""}
const dateOut=v=>{if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;const p=String(v||"").split(".");return p.length===3?p.reverse().join("-"):v};
async function saveNew(){try{const t=(S.templates||[]).find(x=>Number(x.id)===Number(etemplate.value));if(!t)throw Error("Выберите шаблон мероприятия");await api("/admin/events",{method:"POST",body:JSON.stringify({route_id:t.route_id,event_date:dateOut(edate.value),event_time:etime.value,price:+eprice.value,max_places:+emax.value||30,meeting_point:emeet.value})});manageEvents()}catch(e){alert(e.message)}}
async function saveEdit(id){try{await api("/admin/events/"+id,{method:"PUT",body:JSON.stringify({route_id:(S.templates||[]).find(x=>Number(x.id)===Number(etemplate.value))?.route_id||0,event_date:dateOut(edate.value),event_time:etime.value,price:+eprice.value,max_places:+emax.value||30,meeting_point:emeet.value})});manageEvents()}catch(e){alert(e.message)}}
async function removeEvent(id){if(confirm("Удалить мероприятие?")){await api("/admin/events/"+id,{method:"DELETE"});manageEvents()}}
async function reports(){try{const d=await api("/admin/reports");let h='<div class="card"><div class="title">📊 Отчёты</div><div class="field"><span class="field-title">Сводный отчёт за период</span><div class="grid"><input id="rfrom" type="date"><input id="rto" type="date"></div><button class="btn primary" onclick="periodReport()">📊 Сформировать сводный отчёт</button></div>';if(!d.groups?.length)h+='<p class="muted">Заявок пока нет.</p>';for(const g of d.groups)h+='<button class="btn" onclick="report('+g.event_id+')">📊 '+dt(g.event_date)+' · '+esc(g.event_time)+'<br>🛶 '+esc(g.route_title)+'<br>👥 '+g.people+' · 🏄 '+g.boards+' · 💰 '+money(g.revenue)+'</button>';h+='</div><button class="btn" onclick="back()">🏠 Админ-панель</button>';app.innerHTML=h}catch(e){app.innerHTML='<div class="card error">'+esc(e.message)+'</div><button class="btn" onclick="back()">⬅️ Админ-панель</button>'}}
async function periodReport(){try{const from=document.getElementById("rfrom").value,to=document.getElementById("rto").value;if(!from||!to)throw Error("Выберите период");const d=await api("/admin/reports/summary?from="+encodeURIComponent(from)+"&to="+encodeURIComponent(to));const s=d.summary||{};app.innerHTML='<div class="card"><div class="title">📊 Сводный отчёт</div><p>Период: '+dt(from)+' — '+dt(to)+'</p><p>📅 Мероприятий: <b>'+Number(s.events||0)+'</b><br>📋 Заявок: <b>'+Number(s.bookings||0)+'</b><br>👥 Участников: <b>'+Number(s.people||0)+'</b><br>💰 Выручка: <b>'+money(s.revenue)+'</b></p></div><button class="btn" onclick="reports()">⬅️ К отчётам</button><button class="btn" onclick="back()">🏠 Админ-панель</button>'}catch(e){alert(e.message)}}
async function report(id){try{const d=await api("/admin/reports/"+id);await api("/admin/reports/archive",{method:"POST",body:JSON.stringify({event_id:id})});let h='<div class="card"><div class="title">📊 Отчёт: '+esc(d.route_title)+'</div><p>📅 '+dt(d.event_date)+' · '+esc(d.event_time)+'</p>';for(const b of d.bookings)h+='<p>• '+esc(b.full_name)+' — '+esc(b.phone)+' · 👥 '+(1+b.children)+' · 🏄 1 · 💰 '+money(b.revenue)+'</p>';h+='<hr><b>👥 Людей: '+d.total_people+'</b><br><b>🏄 Досок: '+d.total_boards+'</b><br><b>💰 Выручка: '+money(d.total_revenue)+'</b></div><button class="btn" onclick="reports()">⬅️ Вернуться в выбор отчёта</button><button class="btn" onclick="back()">🏠 Админ-панель</button>';app.innerHTML=h}catch(e){app.innerHTML='<div class="card error">'+esc(e.message)+'</div><button class="btn" onclick="reports()">⬅️ Назад</button>'}}
async function initAdmin(){try{const d=await api("/events");S.events=d.events||[];S.routes=d.routes||[];if(!d.isAdmin){app.innerHTML="<div class=\"card error\">⛔ Нет доступа к административной панели.</div>";return}adminHome()}catch(e){app.innerHTML="<div class=\"card error\">⚠️ "+esc(e.message)+"</div>"}}initAdmin();</script></body></html>
