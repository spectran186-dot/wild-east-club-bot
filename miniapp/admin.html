 settings();

'</div>';h+='<div class="card"><div class="title">🥾 Пешие прогулки — картинка по умолчанию</div><p class="muted small">Используется для новых мероприятий типа «Пеший маршрут».</p>';if(d.default_hiking_image_url)h+='<img src="'+d.default_hiking_image_url+'" style="width:100%;aspect-ratio:2/1;object-fit:cover;border-radius:12px;margin:8px 0">';h+='<input type="file" accept="image/jpeg,image/png,image/webp,image/avif" onchange="uploadMedia(\'default_hiking\',this.files[0])">';if(d.default_hiking_image_url)h+='<button class="btn danger" onclick="deleteMedia(\'default_hiking\',0)">🗑 Удалить</button>';h+='</div>';}if(S.permissions.includes("admins")){h+='<div class="card"><div class="title">👥 Администраторы</div><button class="btn primary" onclick="adminForm()">➕ Добавить администратора</button>';for(const x of (d.admins||[])){const owner=x.role==="owner";h+='<div class="participant"><b>👤 Telegram ID: '+esc(x.telegram_id)+'</b><br>Роль: <b>'+esc(x.role)+'</b><br><span class="muted">Права: '+(x.permissions||[]).map(permName).join(", ")+'</span>';if(!owner)h+='<div class="compact-actions"><button class="btn" onclick="adminForm('+x.telegram_id+')">✏️ Изменить</button><button class="btn danger" onclick="removeAdmin('+x.telegram_id+')">🗑 Удалить</button></div>';else h+='<div class="muted small">Основной администратор защищён.</div>';h+='</div>'}h+='</div>';}h+='<button class="btn" onclick="back()">⬅️ Админ-панель</button>';app.innerHTML=h;document.getElementById("season-sup")?.addEventListener("click",()=>saveSeason("sup"));document.getElementById("season-hiking")?.addEventListener("click",()=>saveSeason("hiking"))}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'</div><button class="btn" onclick="back()">⬅️ Админ-панель</button>'}}

async function broadcastEvent(id){try{const d=await api("/admin/events"),e=(d.events||[]).find(x=>Number(x.id)===Number(id));if(!e)throw Error("Мероприятие не найдено");app.innerHTML='<div class="card event-head"><div class="title">📨 Сообщение участникам</div><p><b>'+esc(e.title||e.event_title||e.template_name||"Мероприятие")+'</b><br>📅 '+dt(e.event_date)+' · '+esc(e.event_time||"")+'</p></div><div class="card"><label>Сообщение<textarea id="broadcastMessage" rows="8" maxlength="4000" placeholder="Введите сообщение для подтвержденных участников"></textarea></label><p class="muted small">Получатели определяются по номеру телефона участника. Сообщение отправляется в Telegram, если для этого номера есть привязанный Telegram-аккаунт.</p><button class="btn primary" onclick="sendBroadcast('+id+')">📨 Отправить по телефонам</button><button class="btn" onclick="manageEvents()">⬅️ К мероприятиям</button><button class="btn" onclick="back()">🏠 Админ-панель</button></div>'}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'</div><button class="btn" onclick="manageEvents()">⬅️ Назад</button>'}}
async function sendBroadcast(id){try{const message=document.getElementById("broadcastMessage")?.value?.trim();if(!message)throw Error("Введите сообщение");if(!confirm("Отправить сообщение подтвержденным участникам по номерам телефонов?"))return;const d=await api("/admin/events/"+id+"/broadcast",{method:"POST",body:JSON.stringify({message})});app.innerHTML='<div class="card center"><div class="title">✅ Сообщение отправлено</div><p>Номеров: '+Number(d.total||0)+'<br>Отправлено: '+Number(d.sent||0)+(d.unavailable?'<br>Нет Telegram-привязки: '+Number(d.unavailable):"")+'</p><button class="btn" onclick="manageEvents()">⬅️ К мероприятиям</button><button class="btn" onclick="back()">🏠 Админ-панель</button></div>'}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'</div><button class="btn" onclick="broadcastEvent('+id+')">⬅️ Вернуться к сообщению</button>'}}
async function manageEvents(){try{const d=await api("/admin/events"),es=d.events||[];let h='<div class="card"><div class="title">📅 Мероприятия</div><button class="btn" onclick="manageTemplates()">🧩 Шаблоны мероприятий</button></div><div class="card"><div class="title">📅 Запланированные мероприятия</div>';if(!es.length)h+='<p class="muted">Пока мероприятий нет.</p>';for(const ev of es)h+='<div class="participant"><b>📅 '+dt(ev.event_date)+' · '+esc(ev.title||ev.event_title||ev.template_name||"Мероприятие")+'</b><br>'+(ev.type==="hiking"?"🥾 Пешая прогулка":"🏄 САП-сплав")+(ev.event_time?" · "+esc(ev.event_time):"")+'<br>💰 '+(ev.type==="hiking"?'Взрослый '+money(ev.price_adult||ev.price)+' · Ребёнок '+money(ev.price_child):money(ev.price))+'<div class="compact-actions"><button class="btn" onclick="editEvent('+ev.id+')">✏️ Изменить</button><button class="btn" onclick="copyEvent('+ev.id+')">📋 Копия</button></div></div>';h+='</div><button class="btn primary" onclick="addEvent()">➕ Добавить мероприятие</button><button class="btn" onclick="back()">⬅️ Админ-панель</button>';app.innerHTML=h}catch(e){app.innerHTML='<div class="card error">'+esc(e.message)+'</div><button class="btn" onclick="back()">⬅️ Назад</button>'}}

async function manageTemplates(){try{const d=await api("/admin/event-templates"),ts=d.templates||[];let h='<div class="card"><div class="title">🧩 Шаблоны мероприятий</div><p class="muted">Шаблон не привязан к маршруту. Один шаблон можно использовать для разных маршрутов.</p>';if(!ts.length)h+='<p class="muted">Шаблонов пока нет.</p>';for(const t of ts)h+='<div class="participant"><b>🧩 '+esc(t.name)+'</b><br>🕒 '+esc(t.event_time)+' · '+(t.type==="hiking"?'💰 Взрослый '+money(t.price_adult||t.price)+' · Ребёнок '+money(t.price_child):'💰 '+money(t.price))+' · 👥 '+Number(t.max_places||30)+'<br>📍 '+esc(t.meeting_point||"—")+'<div class="compact-actions"><button class="btn" onclick="editTemplate('+t.id+')">✏️ Изменить</button><button class="btn danger" onclick="removeTemplate('+t.id+')">🗑 Удалить</button></div></div>';h+='</div><button class="btn primary" onclick="templateForm()">➕ Создать шаблон мероприятия</button><button class="btn" onclick="manageEvents()">⬅️ К мероприятиям</button>';app.innerHTML=h}catch(e){app.innerHTML='<div class="card error">'+esc(e.message)+'</div><button class="btn" onclick="manageEvents()">⬅️ Назад</button>'}}

async function routeForm(id){const d=await api("/admin/routes"),r=(d.routes||[]).find(x=>x.id==id)||{},ts=(await api("/admin/event-templates")).templates||[],links=(await api("/admin/route-templates")).links||[],selected=links.filter(x=>Number(x.route_id)===Number(id)).map(x=>Number(x.template_id));app.innerHTML='<div class="card"><div class="title">'+(id?'✏️ Редактировать маршрут':'➕ Создать маршрут')+'</div><label>Название маршрута<input id="rtitle" value="'+esc(r.title||'')+'"></label><label>Тип маршрута<select id="rtype"><option value="sup" '+(r.type!=="hiking"?'selected':'')+'>🏄 САП-сплав</option><option value="hiking" '+(r.type==="hiking"?'selected':'')+'>🥾 Пеший маршрут</option></select></label><div class="grid"><label>Точка старта<input id="rstart" value="'+esc(r.start_point||'')+'"></label><label>Точка финиша<input id="rfinish" value="'+esc(r.finish_point||'')+'"></label></div><label>Описание<textarea id="rdesc">'+esc(r.description||'')+'</textarea></label><label>Продолжительность<input id="rduration" value="'+esc(r.duration||'')+'"></label><label>Цена по умолчанию<input id="rprice" inputmode="numeric" value="'+(r.default_price||'')+'"></label><div class="field-title">Привязать шаблоны</div>'+ts.map(t=>'<label style="display:flex;align-items:center;gap:8px;margin:7px 0;font-weight:600"><input type="checkbox" name="rtemplate" value="'+t.id+'" '+(selected.includes(Number(t.id))?'checked':'')+'> '+esc(t.name)+'</label>').join("")+'<button class="btn primary" onclick="'+(id?'saveRoute('+id+')':'saveRouteNew()')+'">💾 Сохранить маршрут</button>'+(id?'<button class="btn danger" onclick="removeRoute('+id+')">🗑 Удалить':'')+'<button class="btn" onclick="manageRoutes()">⬅️ К маршрутам</button></div>'}

function eventForm(e={},copy=false){S.currentEventImageKey=e.image_key||"";const type=e.type||"sup",imageMode=e.image_key?"custom":"default",hiking=type==="hiking";app.innerHTML='<div class="card"><div class="title">'+(e.id?(copy?'📋 Копировать мероприятие':'✏️ Редактировать мероприятие'):'➕ Добавить мероприятие')+'</div><label>1. Тип мероприятия<select id="etype" onchange="refreshTemplates()"><option value="sup" '+(!hiking?'selected':'')+'>🏄 САП-сплав</option><option value="hiking" '+(hiking?'selected':'')+'>🥾 Пешая прогулка</option></select></label><label>2. Шаблон мероприятия<select id="etemplate" onchange="applyEventTemplate()"><option value="">— Без шаблона, заполнить вручную —</option></select></label><div class="muted small">Если шаблон выбран, его данные подставляются автоматически. Если шаблон не выбран — поля заполняются вручную.</div><label>Название мероприятия<input id="etitle" value="'+esc(e.title||"")+'" placeholder="Название мероприятия"></label><label>Дата<input id="edate" type="date" value="'+(e.event_date||"")+'"></label><label>Время<input id="etime" placeholder="10:00-13:00" value="'+esc(e.event_time||"")+'"></label><div id="eventPriceBox">'+(hiking?'<label>Цена взрослого<input id="epriceadult" inputmode="numeric" value="'+(e.price_adult||e.price||"")+'"></label><label>Цена ребёнка до 14 лет<input id="epricechild" inputmode="numeric" value="'+(e.price_child||"")+'"></label>':'<label>Цена<input id="eprice" inputmode="numeric" value="'+(e.price||"")+'"></label>')+'</div><label>Максимум участников<input id="emax" inputmode="numeric" value="'+(e.max_places||30)+'"></label><label>Точка встречи<input id="emeet" value="'+esc(e.meeting_point||"")+'"></label><div class="field-title">Изображение мероприятия</div><label><input type="radio" name="imageMode" value="default" checked onchange="toggleEventImage()"> По умолчанию по типу мероприятия</label><label><input type="radio" name="imageMode" value="custom" '+(imageMode==="custom"?'checked':'')+' onchange="toggleEventImage()"> Загрузить свою картинку</label><div id="customImageBox" class="'+(imageMode==="custom"?"":"hidden")+'"><input id="eventImageFile" type="file" accept="image/jpeg,image/png,image/webp,image/avif"></div>'+(e.image_key?'<div class="muted small">У мероприятия установлена собственная картинка.</div>':"")+'<button class="btn primary" onclick="'+(e.id&&!copy?"saveEdit("+e.id+")":"saveNew()")+'">💾 Сохранить</button>'+(e.id&&!copy?'<button class="btn danger" onclick="removeEvent('+e.id+')">🗑 Удалить</button>':"")+'<button class="btn" onclick="manageEvents()">⬅️ Вернуться к мероприятиям</button><button class="btn" onclick="back()">🏠 Админ-панель</button></div>';refreshTemplates();toggleEventImage()}
function refreshTemplates(){const type=document.getElementById("etype")?.value,sel=document.getElementById("etemplate");if(!sel)return;const current=Number(sel.dataset.current||0);const ts=(S.templates||[]).filter(t=>(t.type||"sup")===type);sel.innerHTML='<option value="">— Без шаблона, заполнить вручную —</option>'+ts.map(t=>'<option value="'+t.id+'">'+esc(t.name)+' · '+esc(t.event_time)+' · '+(type==="hiking"?(money(t.price_adult||t.price)+' / '+money(t.price_child||0)):money(t.price))+'</option>').join("");if(current&&ts.some(t=>Number(t.id)===current))sel.value=String(current);sel.dataset.current=sel.value||"";applyEventTemplate();const hiking=type==="hiking",box=document.getElementById("eventPriceBox");if(box){const a=document.getElementById("epriceadult")?.value||"",c=document.getElementById("epricechild")?.value||"",p=document.getElementById("eprice")?.value||"";box.innerHTML=hiking?'<label>Цена взрослого<input id="epriceadult" inputmode="numeric" value="'+a+'"></label><label>Цена ребёнка до 14 лет<input id="epricechild" inputmode="numeric" value="'+c+'"></label>':'<label>Цена<input id="eprice" inputmode="numeric" value="'+(a||p)+'"></label>'}}
function applyEventTemplate(){const t=(S.templates||[]).find(x=>Number(x.id)===Number(etemplate.value));const ids=["etime","emax","emeet"];ids.forEach(id=>{const x=document.getElementById(id);if(x)x.disabled=!!t});const title=document.getElementById("etitle");if(title)title.disabled=false;if(t){if(title)title.value=t.name||"";etime.value=t.event_time||"";emax.value=t.max_places||30;emeet.value=t.meeting_point||"";if(document.getElementById("etype").value==="hiking"){epriceadult.value=t.price_adult||t.price||0;epricechild.value=t.price_child||0}else{eprice.value=t.price||0}}}
function toggleEventImage(){const mode=document.querySelector('input[name="imageMode"]:checked')?.value;document.getElementById("customImageBox")?.classList.toggle("hidden",mode!=="custom")}
const dateOut=v=>{if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;const p=String(v||"").split(".");return p.length===3?p.reverse().join("-"):v};
async function saveEventImage(eventId){const mode=document.querySelector('input[name="imageMode"]:checked')?.value;if(mode!=="custom")return null;const f=document.getElementById("eventImageFile")?.files?.[0];if(!f)return null;const q=new URLSearchParams({kind:"event",event_id:eventId});const r=await fetch("/api/admin/media?"+q,{method:"POST",body:f,headers:{"Content-Type":f.type,"X-Telegram-Init-Data":initData}}),d=await r.json().catch(()=>({error:"Ошибка ответа"}));if(!r.ok)throw Error(d.error||("HTTP "+r.status));return d.key}
async function saveNew(){try{const templateId=Number(etemplate.value||0)||null,hiking=etype.value==="hiking",adult=hiking?+epriceadult.value:+eprice.value,child=hiking?+epricechild.value:0;if(!templateId&&!etitle.value.trim())throw Error("Укажите название мероприятия");const created=await api("/admin/events",{method:"POST",body:JSON.stringify({type:etype.value,template_id:templateId,title:etitle.value.trim(),event_date:dateOut(edate.value),event_time:etime.value,price:adult,price_adult:adult,price_child:child,max_places:+emax.value||30,meeting_point:emeet.value})});if(created.id)await saveEventImage(created.id);manageEvents()}catch(e){alert(e.message)}}
async function saveEdit(id){try{const templateId=Number(etemplate.value||0)||null,imageMode=document.querySelector('input[name="imageMode"]:checked')?.value,file=document.getElementById("eventImageFile")?.files?.[0],hiking=etype.value==="hiking",adult=hiking?+epriceadult.value:+eprice.value,child=hiking?+epricechild.value:0;if(!templateId&&!etitle.value.trim())throw Error("Укажите название мероприятия");let image_key=imageMode==="default"?null:S.currentEventImageKey||null;await api("/admin/events/"+id,{method:"PUT",body:JSON.stringify({type:etype.value,template_id:templateId,title:etitle.value.trim(),event_date:dateOut(edate.value),event_time:etime.value,price:adult,price_adult:adult,price_child:child,max_places:+emax.value||30,meeting_point:emeet.value,image_key})});if(file)await saveEventImage(id);manageEvents()}catch(e){alert(e.message)}}
async function removeEvent(id){if(confirm("Удалить мероприятие?")){await api("/admin/events/"+id,{method:"DELETE"});manageEvents()}}
async function report(id){try{const d=await api("/admin/reports/"+id);let h='<div class="card"><div class="title">📊 '+esc(d.event_title||d.route_title||"Мероприятие")+'</div><div class="muted small">'+dt(d.event_date)+' · '+esc(d.event_time||"")+'</div>';if(d.bookings?.length){for(const b of d.bookings){const people=1+Number(b.children||0),comment=String(b.comment||"").trim();h+='<div class="report-person"><div class="report-person-main"><span>'+esc(b.full_name||"Без имени")+'</span><b>💰 '+money(b.revenue)+'</b></div><div class="report-person-meta"><span>📞 '+esc(b.phone||"")+'</span><span>🏄 1 SUP</span><span>'+(people===2?'👤👤 2 человека':'👤 1 человек')+'</span></div>'+(comment?'<div class="report-comment">💬 '+esc(comment)+'</div>':"")+'</div>'}}else h+='<p class="muted">Заявок нет.</p>';h+='<div class="report-total"><b>ИТОГО</b><div class="row"><span>👥 '+Number(d.total_people||0)+' чел.</span><span>🏄 '+Number(d.total_boards||0)+' SUP</span><b>💰 '+money(d.total_revenue)+'</b></div></div><button class="btn" onclick="reports()">⬅️ К отчётам</button></div>';app.innerHTML=h}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'</div><button class="btn" onclick="reports()">⬅️ К отчётам</button>'}}async function reports(all=false){try{const d=await api("/admin/reports"+(all?"?all=1":""));let h='<div class="card"><div class="title">📊 '+(all?"Все отчёты":"Отчёты")+'</div><div class="period-box"><div class="field-title">Отчёт за период</div><div class="period-row"><input id="rfrom" type="date" aria-label="Начало периода"><input id="rto" type="date" aria-label="Конец периода"><button class="btn primary" onclick="periodReport()">Сформировать</button></div></div>';if(!all)h+='<button class="btn" onclick="reports(true)">🗂 Все отчёты</button>';else h+='<button class="btn" onclick="reports()">📊 Текущие мероприятия</button>';if(!d.groups?.length)h+='<p class="muted">'+(all?"Отчётов пока нет.":"По текущим мероприятиям отчётов пока нет.")+'</p>';for(const g of d.groups)h+='<button class="btn" onclick="report('+g.event_id+')">📊 '+dt(g.event_date)+' · '+esc(g.event_time)+'<br>🛶 '+esc(g.event_title||"Мероприятие")+'<br>👥 '+g.people+' · 🏄 '+g.boards+' · 💰 '+money(g.revenue)+'</button>';h+='</div><button class="btn" onclick="back()">🏠 Админ-панель</button>';app.innerHTML=h}catch(e){app.innerHTML='<div class="card error">⚠️ '+esc(e.message)+'</div><button class="btn" onclick="back()">⬅️ Админ-панель</button>'}}
async function initAdmin(){try{const d=await api("/events");S.events=d.events||[];S.routes=d.routes||[];S.permissions=d.permissions||[];if(!d.isAdmin){app.innerHTML="<div class=\"card error\">⛔ Нет доступа к административной панели.</div>";return}adminHome()}catch(e){app.innerHTML="<div class=\"card error\">⚠️ "+esc(e.message)+"</div>"}}initAdmin();</script></body></html>
